; Ban User button and flag selector do sit on the faction/vehicle cluster.
; Leave them off for BZP/BZP-T. /ban still works.
LobbyBanButton = 0
; Multiplayer opens a setup screen first (nickname, flag, server status)
; instead of going straight to the lobby. 0 = stock behaviour.
PreLobby = 0
; Matchmaking server picked on the multiplayer setup screen: Rebellion or
; Custom. Blank = stock (the /bzrserver= launch switch, else Rebellion's).
Server =
; Custom server host name or IP (port 1337 only). Used when Server = Custom.
; Your Steam/GOG sign-in ticket is withheld from every non-Rebellion server
; (this, /bzrserver= and the test redirect alike); it needs NetImprovements.
