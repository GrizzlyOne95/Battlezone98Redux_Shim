[SinglePlayer]
; Experimental legacy-GEO vehicle contact for all supported craft. GOG only.
; Stock fallback for unsupported/changed models. Restart required. Default OFF.
VehicleGeometryContact = 0
; Trial: shots hit the craft's real mesh. A shot that passes between parts (a
; cannon and the body) misses and keeps flying; a hit lands on the hull. GOG
; only. Restart required. Default OFF.
MeshAccurateHits = 0
; This section is hard-disabled by OpenShim in network games. Most behavior
; changes remain opt-in; narrowly proven Redux regressions may ship ON because
; the MP gate preserves mixed-client parity.
WeaponConvergence = 0
; Master switches for authored GOG/SP cannon presentation. ON in this preset
; since revision 10: inert unless a mod's ODFs configure them, so stock and
; unconfigured weapons are untouched. Restart required. No generic effects:
; mods must supply ODF configuration and matching assets. MuzzleFlash gates
; flashMesh plus muzzleRender smoke/light. Mesh flashes and recoil clips need
; EXU; native render effects/node slides do not.
MuzzleFlash = 1
MeshRecoil = 1
PlayerReticleConvergence = 0
; Reticle search range in metres. Stock is 200; 500 lets the reticle pick up
; targets and ground further out. Set 200 for stock behaviour.
; OpenShim's own range is single-player only. EXU SetReticleRange (BZP's
; longer reticle) is honored in network games and is not forced back to 200.
SmartReticleRange = 500
; Paint your own ship in single player (high Enhanced render quality on DX11;
