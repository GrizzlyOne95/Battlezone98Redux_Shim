; ============================================================================
; OpenShim Player Configuration
; ============================================================================
; Conservative player defaults. Every first-class openshim.ini setting is
; present here so users can enable supported OpenShim behavior without starting
; from the developer reference. Confirmed Redux engine fixes under [Fixes]
; default ON; optional features, UI replacements, autosave, diagnostics, and
; single-player behavior changes default OFF. Stock-preserving controls use
; their stock value even where that value is numerically 1
; (AllowStartupAutoLoad and SunFlashbang). See openshim.ini.example for
; accepted values, aliases, ranges, restart requirements, implementation notes,
; and raw compatibility variables.
;
; Policy used here:
;   - confirmed Redux engine defects under [Fixes] are enabled by default and
;     individually switchable for regression isolation; the five that touch
;     the simulation also stand down automatically in a network game;
;   - enhancements, UI replacements, autosave, diagnostics, and single-player
;     behavior changes are disabled until explicitly enabled;
;   - renderer selection remains automatic and the visual profile remains the
;     stock-compatible Redux profile, so the [DX11Enhanced] keys below are
;     pre-armed but unreachable until a player opts into RenderProfile =
;     Enhanced on DX11;
;   - GovernorTuning remains OpenShim to preserve the measured networking
;     behavior OpenShim already shipped; set it to Stock for strict mixed-client
;     parity, while net.ini remains the granular authority;
;   - values that only tune a disabled master switch remain present so users
;     can enable that feature without reconstructing its configuration.
;
; Preset revision:
;   This player preset was first introduced in commit e81d8b0a (2026-08-27) but
;   that revision was never merged to main, never tagged as a release, and
;   never shipped via Workshop or the verified static-patches.json release
;   workflow. Repository history (git log --all -- openshim.ini, tag v2.2.301
;   assets, CampaignReimagined InstallerPayload/manifest) contains no
;   openshim.ini payload prior to this branch, so no public preset with a bad
;   default has been proven to have shipped. Nonetheless the migration
;   framework below treats e81d8b0a's content as revision 1 (bad) and this
;   corrected file as revision 2, so the mechanism is qualified before any
;   future problematic preset can reach users. SHA-256 of the R1 payload is
;   documented in include/openshim_preset_migration.h for tooling/tests but
;   not treated as a publicly-shipped hash.
; ============================================================================
; OpenShimPresetRevision = 3

[General]
SoundChannels = 0
CustomBindsUi = 1
; The OpenShim Settings page in Redux Options. This one stays ON because it
; is how a player reaches every other switch in this file without editing it
; by hand; the settings it exposes remain OFF until turned on there.
SettingsUi = 1
ChunkMeshes = 0
MapRefreshFixes = 1
MusicGlobalFocus = 1
; Set to 1 to bypass the legacy smoothed/accelerated mouse-message path and
; use Redux's native raw-input path. Restart the game after changing it.
RawMouseInput = 0
OgreMaterialCollisionGuard = 1
; Restores the BZ 1.5 overhead-view / control-panel display order, which is
; what makes editor object placement work in the running Shift+F10 overhead
; view. Inert unless the game was launched with /edit. Restart required.
EditorOverheadPlacementOrder = 1
; 0 keeps the stock behavior: hopping out replays one stale under-attack growl
; for the craft you just left. Set to 1 to suppress that single alert.
SuppressHopOutAttackAlert = 0

[Fixes]
; Confirmed Redux engine defects OpenShim corrects. Unlike everything else in
; this file these default to ON, because they are bug fixes rather than
; enhancements -- leave them on for normal play.
;
; The first five touch the simulation, so they are gated on the net id the way
; [SinglePlayer] features are: they stand down for the duration of a network
; game, which keeps a lobby mixing OpenShim and stock clients behaviourally
; identical. The last three only change behavior for content that is already
; broken or for script-facing queries, so they are not gated.
;
; They are listed here because anyone bisecting a suspected regression needs to
; be able to isolate one fix. Set a key to 0 to restore stock Redux behavior
; for that defect in single-player too.
; Keep the shipped preset in sync with openshim.ini.example: the mixed
; stock/custom AIP producer-registration repair is a confirmed engine fix.
AiMultiProducerMakers = 1
ApcAlliedTargetDeploy = 1
SplinterUndead = 1
HowitzerUndeployedRetaliation = 1
TugCargoPostLoad = 1
ConstructorRemoteBuild = 1
MagnetZeroRangeGuard = 1
ProducerScriptPredicates = 1
VehicleListModScoping = 1
CliMultiParameterOptions = 1

[Startup]
D3DStartupHooks = 0
; Stock behavior is to allow the startup shell/autoload path.
AllowStartupAutoLoad = 1
BackendTransport = 0

[Graphics]
Renderer = Auto
RenderProfile = Redux

[Terrain]
; Terrain replacement/proxy development is disabled for normal play. The four
; coordinate selectors use the runtime's INT_MIN sentinel explicitly so every
; supported key can remain present without constraining cluster selection.
TerrainProxyEnabled = 0
TerrainProxyZone = -1
TerrainProxyCluster = -1
TerrainProxyZoneX = -2147483648
TerrainProxyZoneZ = -2147483648
TerrainProxyClusterX = -2147483648
TerrainProxyClusterZ = -2147483648
TerrainProxyFollowCamera = 0
TerrainProxyFollowCameraAimDistance = 35.0
TerrainProxyFollowCameraReselectFrames = 300
TerrainProxyOffsetX = 0.0
TerrainProxyOffsetY = 0.0
TerrainProxyOffsetZ = 0.0
TerrainProxyVisible = 0
TerrainSemanticCapture = 0
TerrainSemanticDumpJson = 0
TerrainSemanticRenderer = 0
TerrainSemanticValidateUV = 0
TerrainSemanticLegacyUVQuantization = 0
TerrainSemanticDumpMismatches = 0
TerrainSemanticLifecycleLog = 0
TerrainSemanticDebug = 0
TerrainSemanticFrameCapture = 0
TerrainSemanticFrameCaptureStride = 300
TerrainSemanticFrameCaptureRequireOnScreen = 0
TerrainSemanticFrameCaptureMinCoverage = 0.005
TerrainHdEnabled = 0
TerrainHdManifest = terrain_hd_tiles.json

[DX11Enhanced]
; Both of these apply only while the experimental DX11 Enhanced pipeline is
; actually running -- that needs [Graphics] RenderProfile = Enhanced on a DX11
; render system -- so with the stock Redux profile above they change nothing.
; They are on so that opting into Enhanced gets the whole Enhanced feature set
; rather than a half-configured one. Restart required after changing either.
FXAA = 1
EnhancedLightSelectionV2 = 1

[Display]
UnderAttackAlert = Normal
TargetPolicy = Default
; Master switch for multiplayer vehicle flags: the selection screen, the
; payload upload and the in-match renderer. Restart required.
MultiplayerFlags = 1
MultiplayerFlagShowOwnCraft = 0
ScrapPilotHud = Stock
JetFlames = 0
; Keep the sun, flare sprites, lighting, and shadows while suppressing only the
; pathological full-screen white ScreenFlash contribution.
; Stock behavior is ON; set this to 0 to enable OpenShim's suppression.
SunFlashbang = 1
UnitVoFeedback = Normal

[AutoSave]
Enabled = 0
IntervalSeconds = 120
InitialDelaySeconds = 10
RetrySeconds = 15
BackupExisting = 0
RespectExternalAutoSave = 0

[Diagnostics]
; Diagnostics and forensic capture remain dormant for normal gameplay.
EnhancedLightSelectionTrace = 0
TraceHookHits = 0

; Identify the first-person pilot Entity by walking the Ogre scene graph every
; 1.5 s, and log its AnimationState traffic. Capture tool for pilot animation
; investigation; see reverse_engineering/PILOT_FP_ANIMATION_TRACE.md.
; Accepted: boolean. Default: OFF. Development-only, noisy, and it polls the
; scene graph on a worker thread -- leave it off for normal play.
; Legacy env alias: OPENSHIM_TRACE_PILOT_FP_ANIMATIONS
TracePilotFPAnimations = 0
TraceArtilleryMask = 0
TraceSunFlash = 0
TraceDX11ColorSpace = 0
TraceDX11EnhancedLighting = 0
TraceMapRefresh = 0
TraceJumpSniping = 0
TraceSatelliteVisibility = 0
ProfileOgreAnimation = 0
TerrainRenderProbe = 0
WalkerCockpitTrace = 0
TerrainRenderProbeMaxClusters = 1
TerrainRenderProbeCluster = -1
TerrainRenderProbeDumpJson = 0
RelayLogging = 0
RelayLogAllControl = 0
RelayLogDatagrams = 0
RelayLoggingPrivateForensic = 0
RelayLoggingAllUdp = 0
RelayLoggingQueueRecords = 4096
UiPerformanceLogging = 0
UiPerformanceVerbose = 0
TraceDamageReveal = 0

[Network]
; OpenShim's socket layer as a whole: winsock hooks, the bandwidth governor,
; auto-kick relaxation, packet reorder/duplicate mitigation and DSCP marking.
; Set to 0 for stock networking -- nothing below in this file's socket layer
; installs, and net.ini is not consulted for it. This is the switch to try
; first when diagnosing a connection problem.
NetImprovements = 1

; Which tuning the bandwidth governor and host auto-kick run.
;   OpenShim = OpenShim's measured tuning (this is, and has always been, the
;              shipped behavior -- the key only makes it visible)
;   Stock    = leave every governor and auto-kick value at the game's own
;
; Use Stock for strict parity with players who are not running OpenShim: a
; tuned client sends more than a stock peer on the same link, and a tuned host
; almost never auto-kicks. net.ini still overrides this for granular tuning.
GovernorTuning = OpenShim
RoutePreference = Stock
UdpPort = 0
; Blank = use the Steam/GOG account name.
Nickname =
LiveNicknameKeys = 1
ReauthOnNicknameChange = 0
LobbyReadouts = 1
LobbyBzrnetIntegration = 0

; Restrict the multiplayer starting-vehicle list to the stock balanced
; factions. Local only; it never adds craft the map withheld.
StockFactionsOnly = 0
StockFactionSet = as

[Gameplay]
AllowNeutralAttackOrders = 0

[Career]
; Kills, deaths and missions played, recorded to career_stats.cfg in single
; player and multiplayer. Local file only; no mission script required.
StatsTracking = 1

[SinglePlayer]
; This section is hard-disabled by OpenShim in network games.
WeaponConvergence = 0
PlayerReticleConvergence = 0
SmartReticleRange = 500
SmartScavengerPathing = 0
TurretAimPitch = 0
TurretAimPitchMultiplier = 0.95
JumpSnipeCrouch = 0
; weaponMask-aware AI weapon selection, off by default and forced off in
; network games. When on, the AI fires every fitted hardpoint the craft's
; weaponMask names, as one synchronized volley, instead of only the first.
; Not a no-op for stock content: the default mask 11111 means every fitted
; hardpoint, so a stock howitzer with four mortar hardpoints fires four
; rounds per cycle and consumes four times the ammo.
AiWeaponMaskArtillery = 0
AiWeaponMaskMinelayer = 0
AiOdfGameplayTuning = 0
BomberAiRange = 0
Turbo = 0
TurboTolerance = 0.9
Headlights = 0
OtherHeadlights = 0
HeadlightColor = Stock
HeadlightBeam = Stock
AttackRevealPerceivedTeam = 0
SatelliteVisibilityFix = 0

[Environment]
; Raw OPENSHIM_* / BZR_* compatibility variables may be supplied here when a
; legacy launch script or one-off developer probe requires them. Normal players
; should leave this section empty and use the first-class settings above.
