; ============================================================================
; OpenShim Player Configuration
; ============================================================================
; Conservative player defaults. Every first-class openshim.ini setting is
; present here so users can enable supported OpenShim behavior without starting
; from the developer reference.
;
; Shipping-default policy:
;   - crash prevention, stability fixes, and qualified Redux bug fixes default
;     ON unless they can substantially alter multiplayer behavior or create a
;     mixed-client difference against players who are not running OpenShim;
;   - qualified netcode fixes default ON;
;   - the native keybind UI and OpenShim Settings UI default ON because they are
;     the supported way to reach all other settings;
;   - every other enhancement, presentation change, gameplay change, autosave,
;     diagnostic, experimental feature, and convenience feature defaults OFF;
;   - stock-preserving controls keep their stock value even when that value is
;     numerically 1 (for example AllowStartupAutoLoad and SunFlashbang).
;
; See openshim.ini.example for accepted values, aliases, ranges, restart
; requirements, implementation notes, and raw compatibility variables.
;
; Policy details:
;   - [Fixes] is not blanket-enabled: each default-ON fix must be individually
;     safe under the rule above. Fixes with unresolved or material mixed-client
;     multiplayer impact remain OFF until they are gated or qualified;
;   - [SinglePlayer] normally defaults OFF, but a proven Redux regression may
;     default ON when OpenShim hard-disables it for network games;
;   - renderer selection defaults to Auto (the game's last choice) and the
;     visual profile remains the stock-compatible Redux profile. DX11 Enhanced
;     subfeatures remain OFF until explicitly enabled with that profile;
;   - GovernorTuning remains OpenShim as part of the qualified netcode baseline;
;     set it to Stock for strict stock governor/auto-kick behavior, while net.ini
;     remains the granular authority;
;   - values that only tune a disabled master switch remain present so users can
;     enable that feature without reconstructing its configuration.
;
; Preset revision:
;   This player preset was first introduced in commit e81d8b0a (2026-08-27) but
;   that revision was never merged to main, never tagged as a release, and
;   never shipped via Workshop or the verified static-patches.json release
;   workflow. Repository history (git log --all -- openshim.ini, tag v2.2.301
;   assets, CampaignReimagined InstallerPayload/manifest) contains no
;   openshim.ini payload prior to this branch, so no public preset with a bad
;   default has been proven to have shipped. Nonetheless the migration
;   framework below treats e81d8b0a's content as revision 1 (bad) and the
;   corrected preset lineage as revision 2/3 so the mechanism is qualified
;   before any future problematic preset can reach users. This policy adjustment
;   does not forcibly rewrite existing customized user INIs.
; ============================================================================
; OpenShimPresetRevision = 13

[General]
SoundChannels = 0
CustomBindsUi = 1
; The OpenShim Settings page in Redux Options. This one stays ON because it
; is how a player reaches every other switch in this file without editing it
; by hand; the settings it exposes remain OFF until turned on there.
SettingsUi = 1
; Destruction chunks (visual only): the Options row "Destruction Chunks" sets this and
; FractureOnePiece together.
ChunkMeshes = 1
; Generated chunk mesh cache (openshim/cache/chunks) is pruned at startup.
; Size cap in MB (0 = no cap) and days unused before a model folder expires (0 = never).
ChunkCacheMaxMB = 256
ChunkCacheMaxAgeDays = 30
; Person deaths as rigid limb gibs (visual only). An enhancement, so OFF in
; this preset; the feature itself defaults ON when the key is absent.
SkinnedGibs = 0
SkinnedGibsMax = 96
SkinnedGibsLinger = 6
SkinnedGibsForce = 1.0
; Gibs past this many metres from the camera are hidden (render only; 0 = off).
SkinnedGibsDrawDistance = 150
; One-piece craft and buildings cut into capped pieces on death (visual
; only). ON in this preset, together with ChunkMeshes.
FractureOnePiece = 1
; Brass casings ejected by cannon-like weapons (visual only). An
; enhancement, so OFF in this preset and when the key is absent.
ShellCasings = 0
ShellCasingsMax = 32
ShellCasingsLinger = 4
; Casings past this many metres from the camera are hidden (render only; 0 = off).
ShellCasingsDrawDistance = 70
ShellCasingsClasses = cannon,mortar,machinegun,snipergun,-gquake,-gsandbag
; Beam from the selected weapon (visual only; off in multiplayer). An
; enhancement, so OFF in this preset and when the key is absent.
LaserSight = 0

; AI path grid follows collision faces for ODFs with pathBlock = "faces"
; (tunnels, arcades, walk-in rooms). Opt-in per ODF, so ON.
PathBlockFaces = 1
; Menu screens (Instant Action, Multiplayer, Custom Campaigns) open and close
; without the Modable material rebuild; content still loads in full before a
; mission starts and in the multiplayer game room.
FastMenuTransitions = 1
; Multiplayer map-list refresh/jump and selection-preservation bug fixes.
MapRefreshFixes = 1
; Adds "5+ Players", "Stock Maps" and a map search box to Create Game.
MapFilterExtras = 0
; Ctrl+A..Ctrl+Z in the Create Game map list jump to the next map starting with that letter.
MapListLetterJump = 1
MusicGlobalFocus = 1
; Set to 1 to bypass the legacy smoothed/accelerated mouse-message path and
; use Redux's native raw-input path. Restart the game after changing it.
RawMouseInput = 0
; Set to 1 for BZ2-style "Control Smoothing: Off": steer, aim, throttle and
; strafe follow input directly instead of easing toward it. Restart required.
DisableControlSmoothing = 0
OgreMaterialCollisionGuard = 1
; Restores the BZ 1.5 overhead-view / control-panel display order, which is
; what makes editor object placement work in the running Shift+F10 overhead
; view. Inert unless the game was launched with /edit. Restart required.
EditorOverheadPlacementOrder = 1
; World Builder saves go back to the folder the map was loaded from, after a
; prompt that shows the real destination (Cancel is the default). 0 keeps
; stock: saves land in the root addon folder. Restart required.
EditorSaveToSourceFolder = 1
; 0 keeps the stock behavior: hopping out replays one stale under-attack growl
; for the craft you just left. Set to 1 to suppress that single alert.
SuppressHopOutAttackAlert = 0

[Fixes]

; Say why the main-menu multiplayer entry reads "Not Ready". Stock has no
; way to say: its readiness getter returns only ready/not-ready, so platform
; sign-in, service transport and a refused sign-in all look identical. This
; reports the term that actually failed in the shell's own MPStatus text,
; directly under the entry -- no hover, it is ordinary on-screen text.
; Contained: exactly one of the 41 call sites reads the readiness value, and
; only the one message lookup is redirected. Byte-guarded on both sites; a
; mismatch stands the explainer down and leaves the diagnostic reporting.
; The messages are English only -- naming the real term is worth more than a
; localized string that can only ever say one of two wrong things.
; Accepted: boolean. Default: ON -- testers who hit this have no other
; way to report a reason. Set to 0 to restore the bare stock "Not Ready".
; Env override to disable: OPENSHIM_NO_EXPLAIN_MP_NOT_READY
ExplainMultiplayerNotReady = 1
; Confirmed Redux engine defects. Default ON only when the fix is safe under the
; shipping policy above. Simulation-affecting fixes that are explicitly gated
; out of network games may ship ON; fixes that can materially change mixed-client
; multiplayer behavior remain OFF until gated or qualified.
;
; They remain individually switchable so a suspected regression can be bisected
; without removing OpenShim.
;
; The following nine touch simulation but stand down automatically in network
; games, preserving stock/OpenShim mixed-client behavior.
; Mixed/custom producer registration changes AI production; set 0 to restore
; the stock first-producer-only choice in single player too.
AiMultiProducerMakers = 1
ApcAlliedTargetDeploy = 1
SplinterUndead = 1
OwnedObjectReveal = 1
HowitzerUndeployedRetaliation = 1
TugCargoPostLoad = 1
ConstructorRemoteBuild = 1
AIConstructionCounterRepair = 0
; Keep a Daywrecker SeismicWave inside its terrain-delta buffer (stock overruns
; it and leaves spires/pits). Drops only zero-delta cells; applies online too.
SeismicWaveExtentClamp = 1
; Stop huge dynamic draws (draw_planar radius ~300+) crashing on a full
; DynamicMain buffer: fix the index check and skip a draw that cannot fit.
DynamicAllocGuard = 1
; Hold a Lua mission callback's error alert until the frame ends. Stock opens
; its modal from inside the callback, and the modal keeps the world simulating
; and rendering while, for example, DeleteObject has half torn its object down;
; that can crash. Start/Update/GameKey/Create/Add/DeleteObject, the Player
; callbacks and Receive log the error at once and show the same alert after
; the frame (repeats collapsed). Other Lua errors are stock.
; Accepted: boolean. Default: ON. Env override to disable:
; OPENSHIM_NO_DEFER_LUA_CALLBACK_ALERT
DeferLuaCallbackAlert = 1
; Step the simulation by the measured frame time instead of whole milliseconds
; (stock steps 6, 7, 7 ms at 144 fps). Game time is unchanged.
PreciseTimestep = 1
; Decode a new music track's first 3 s once instead of twice; shortens the
; main-thread hitch at each track change. Client-local audio.
MusicSingleFill = 1
; Refill every music chunk playback has passed, so a late decoder wake cannot
; leave the stream replaying stale audio (the CD-like skip). Client-local audio.
MusicRefillCatchUp = 1
; Two constructors ordered to recycle the same building each run their own
; unbuild countdown. The first to finish deletes the building; stock never
; clears the loser's unbuild handle, so it stays deployed for the rest of the
; mission, accepting orders it can never act on. Releases that stale handle.
ConstructorRecycleStaleTarget = 1
; Defensive crash/stability guard for invalid/non-positive magnet ranges.
MagnetZeroRangeGuard = 1
; Stock ordnance teardown detaches each round's mesh and never destroys it, so
; every shot fired leaks one Ogre entity for the rest of the mission. Destroys
; it once the stock teardown has finished. Client-local render state only.
OrdnanceEntityLeak = 1
; Mission briefing / archive text is scrolled a page at a time; the page size is
; measured with a probe that ends in a letter, but pages are drawn with a
; newline after every line and measure slightly taller. For some box heights a
; page then shows one line fewer than the scroll step skips (a line vanishes at
; each page break; a full last page hides its final line). Measures the probe
; the way the page is drawn. Client-local UI only.
BriefingPageStride = 1
; Pilot sniper shot follows the reticle while ejected/tilted; single player only (see openshim.ini.example).
SniperEjectAimFix = 1
; Heap-corruption guard: remote scavenger NetProcess is not a ScavengerProcess.
ScavengerNetProcessGuard = 1
; Stock Lua Formation(unit, leader, priority) reads the leader as an integer and raises
; "number expected, got userdata". Repairs the binding (GOG Redux 2.2.301 only).
LuaFormationBinding = 1
; Lua GetIndependence read a still-loading save's AI process placeholder and crashed
; on save load. Returns 0 for a process that is not a real object.
LuaGetIndependenceGuard = 1
; The objective list holds 10 entries; an 11th objective (script, mission or save)
; overwrote memory past it. A full list now drops its oldest objective first.
ObjectiveCapGuard = 1
; AnchorRocket on a stopped target with a custom negative drag wrote NaN into it;
; negative-drag boosts are now capped (100 m/s, 10 rad/s).
AnchorDragGuard = 1
; A TRN area outside zones -24..103 (MinX/MinZ/Width/Depth) overwrote memory past
; the terrain zone tables. Out-of-range zones are skipped and logged.
TerrainZoneTableGuard = 1
; Terrain height reads only trust a zone pointer into the loaded .hg2.
TerrainHeightSampleGuard = 1
; An object whose position, rotation or motion became NaN/infinite is restored.
NaNTransformGuard = 1
; An object whose Ogre model was already destroyed (seen inside a Lua error
; alert) crashed the render update. Its render sync is skipped and logged.
RenderSyncVtableGuard = 1
; Lua GiveWeapon(h, nil, slot) left an AI craft's selected bit on the emptied
; slot (a guided-missile or sniper scan then crashed); also refuses slots 5+.
GiveWeaponNilClearsSelected = 1
; Build menu items whose ODF team is 3+ (or negative) drew in a garbage colour,
; in the build menu and the control panel; now clamped to white/green/red.
BuildMenuTeamColorClamp = 1
; A sniper kill on a craft the shooter's own machine owns (e.g. the host sniping
; host AI) was never scored. Network games only; single player is unchanged.
SniperKillCredit = 1
; Read-only: logs a warning at 90% of the object handle sequence space (~1M
; objects made in a session) and an error once new handles stop resolving.
HandleSequenceCheck = 1
; Lua Send strings/tables of 128..255 entries crashed every receiver (signed length
; byte). Reads the byte unsigned; refuses lengths above 255 at the sender.
LuaSendLengthUnsigned = 1
; Lua ObjectiveObjects() never advanced: it returned the first objective forever
; (or hung). Lists every objective once, highest slot first.
ObjectiveObjectsIterator = 1
; Multiplayer: the launcher's deployed splinter position and any damage kill are
; broadcast so every patched peer has the same splinter (needs SplinterUndead).
SplinterSync = 1
; Multiplayer: a splinter's own SprayBomb, BounceBomb and Popper payloads stay
; on each peer. Stock resends them (a Popper sends its child) from every peer,
; so a splinter that fires splinters multiplies once per player each generation.
SplinterPayloadLocal = 1
; Multiplayer "Any Nation" lobby toggle (Battlezone 1.5 parity). The host gets an
; "Any Nation: On/Off" button in the lobby. ON (default) is the full vehicle
; pool, as before. OFF restricts the vehicle-select pool to the 1.5 netveh.odf
; set (27 craft: NSDF 13, CCA 9, Black Dog 5, CRA 0; craft the shipped Redux
; pool lacks are not added back). The host's choice reaches clients through its
; own lobby key, "anyNation" ("0" = OFF, "1" or absent = ON), never the
; positional gameSettings string. The host's choice is kept in multi.ini.
; Any Nation OFF only restricts players running OpenShim; stock clients still
; see the full pool. Lobby stays compatible either way.
; GOG Redux 2.2.301 only; stands down on any other build or byte mismatch.
; Accepted: boolean. Default: ON (a lobby that never turns Any Nation OFF
; publishes nothing new). 0 installs nothing.
AnyNationToggle = 1
; Host-called SucceedMission/FailMission ends the mission on patched guests too
; (stock has no network message for it; unpatched guests ignore the packet).
MissionEndSync = 1
; Multiplayer: when the host leaves, its objects (the AI in co-op) are kept and
; the new host takes them over, and the match no longer ends as Game Over just
; because the leave left one player.
HostLeave = 1
; A launched Daywrecker no longer blows up on the Armory that fired it on the
; other peers' screens (the remote copy ran a frame before its first state).
DaywreckerArmoryCollision = 1
; Host-side: Steam invites to your passworded lobby carry its password, so
; the invited friend gets in without typing it.
InvitePassword = 1
; Host-side: every new game you host starts with Sync Join on (no mid-game
; joins); you can still turn it off in the lobby for that game.
SyncJoinDefaultOn = 1
; Client-side only: release the OS cursor while Redux is minimized or unfocused.
UnfocusedMouseRelease = 1
; Renderer only: craft meshes get their real bounding box back instead of the
; infinite one Redux gives them, so off-screen and distant craft stop being
; drawn and shadowed. No gameplay effect.
RestoreCraftBounds = 1
; Renderer only: skip drawing objects wholly past full fog. Default off.
FogDistanceCull = 0
; Renderer only: effect-sprite batching CPU savings, pixel-identical output.
; Reuse the current DynamicGeometry piece when the depth key matches, and sort
; pieces without calling into OgreMain per compare.
DynamicGeometryPieceReuse = 1
DynamicGeometryFastSort = 1
; Renderer only: scrap farther than this many metres from the camera casts no
; shadow (0 = off, up to 256). Scrap stays visible and collectable.
ScrapShadowDistance = 0
; Renderer only: scrap farther than this many metres from the camera is not
; drawn at all (0 = off, up to 2000). It still exists and can be collected.
ScrapDrawDistance = 0
; Renderer only: 0 leaves scrap out of the glow pass (1 = stock glow). Scrap
; then no longer hides the glow of objects behind it.
ScrapGlow = 1
; Register the frame thread with MMCSS ("Games") and opt out of Windows power
; throttling. Scheduling only; no simulation effect.
ThreadScheduling = 1
; Script-visible producer predicates change mission branching, so they apply
; in single player only. Set 0 for stock CanBuild/IsBusy answers everywhere.
ProducerScriptPredicates = 1
; Reload the multiplayer starting-vehicle list from mod-scoped assets
; (patches 1/4, 2/4, 4/4): the selected map's own .vxt, with cached
; description files dropped first so one mod's list and .des files do not
; leak into another. Patch 3/4 (always-update the vehicle select control)
; stays applied either way and is not the map-list wheel. Set 0 for the
; stock lobby list.
VehicleListModScoping = 1
; Command-line parser repair; no gameplay or mixed-client divergence.
CliMultiParameterOptions = 1
; el_detail_atlas.csv and ga_detail_atlas.csv place four tile rectangles at
; 0.825 instead of 0.875, so those tiles straddle an atlas cell boundary and
; show half of the neighbouring texture. Hands Redux a corrected copy at open
; time; the shipped file is never written. The correction is verified against
; all eleven shipped CSVs.
TerrainAtlasRectRepair = 1
; The multiplayer Create Game vehicle preview inherits a PSSM material scheme
; on a viewport that has shadows disabled, so its shader reads NaN shadow
; matrices and the craft renders as NaN - black - with every submission,
; face and draw-call counter looking healthy. Pins that viewport to the
; matching -noshadow scheme. Verified from a RenderDoc capture.
MpVehiclePreviewShadowScheme = 1
; The Enhanced/Retro profiles rewrite a viewport's material scheme to the
; en-/og- technique family. Only materials that declare those techniques can
; satisfy it, so a Workshop or converted legacy map whose terrain inherits
; stock BZTerrainBase has no match, and Ogre falls back to the material's
; FIRST technique - which is `scheme high-pssm`. Its pass reads shadow
; matrices that were never set up on that viewport, so the sm4 shader writes
; NaN and the terrain renders black on DX11 while DX9 looks correct. This
; answers the scheme miss with the material's own base-scheme technique
; instead, via Ogre's handleSchemeNotFound hook.
EnhancedSchemeFallback = 1
; Redux destroys and rebuilds the sun when a pilot gets into a vehicle, and
; the rebuilt light re-reads the stock mission colours, so lighting a mod set
; through EXU (sun colour, direction, power, shadow distance, ambient) flaps
; back to stock a few seconds into a mission. Puts the mod's values back on
; the rebuilt sun. Set 0 for the stock rebuild.
SunRebuildRestore = 1
; Automatic DX11 legacy material compatibility for old mods. The probe fails
; closed to bounded diagnostics where cached technique instantiation is not
; available. See openshim.ini.example.
DX11LegacyMaterialCompat = 1
; DX11 shaderless-draw safety guard. Skips a draw D3D11 would throw on (a pass
; without both shaders), logs it once ([DX11DRAWGUARD]) and tries one compat
; conversion at the next frame start. See openshim.ini.example.
DX11ShaderlessDrawGuard = 1
; Aggressive generic fallback for unknown custom shaders. Opt-in only: it
; intentionally replaces unknown semantics with a generic approximation.
DX11LegacyMaterialAggressive = 0

[Features]
; Multi-page mission briefings: a mission that ships <mission>_2.des (and
; up to _9) gets page arrows on the pre-launch briefing screen; Left/Right
; and PgUp/PgDn also turn pages. Missions without them are unchanged.
; See Docs/BRIEFING_PAGES.md. Client-local UI only.
BriefingPages = 1
; Database: a DATABASE button on the Single Player screen opens unit entries
; (live ODF stats) and campaign briefings. See Docs/DATABASE_SCREEN.md.
; Client-local UI only.
Database = 1
; Lobby Briefing: a Briefing button in the multiplayer waiting room opens the
; map's .des pages and pictures. See Docs/LOBBY_BRIEFING.md. Client-local UI only.
LobbyBriefing = 1

[Startup]
D3DStartupHooks = 0
; Stock behavior is to allow the startup shell/autoload path.
AllowStartupAutoLoad = 1
; Lets [Graphics] Renderer (the Video page's Renderer row) choose DX9 or DX11
; at startup. Inert while Renderer = Auto, which leaves Ogre.cfg untouched.
BackendTransport = 1

[Graphics]
Renderer = Auto
RenderProfile = Enhanced
; DX11 only: after a GPU reset, recreate the device once the hardware adapter
; has settled instead of mid-reset or on the software rasterizer.
D3D11DeviceLossRecovery = 1
; DX11 only: open the game window on the primary monitor, not a side one.
D3D11PrimaryMonitor = 1
; Options screen: keep the resolution list short (the current value, the
; desktop size, and common sizes matching the desktop aspect).
ResolutionListFilter = 1
; Options screen: clicking the resolution row opens a scrollable list instead
; of cycling one value per click.
ResolutionDropdown = 1
; DX11 windowed only, experimental: present through a flip-model swap chain.
; Off, and exclusive fullscreen, keep the stock blit swap chain.
DxgiFlipModel = 0
; DX11: fullscreen is a borderless window over the monitor instead of exclusive
; mode (Alt-Tab without a mode switch). Set from Options > Graphics > Full
; Screen = Borderless. Restart required.
BorderlessFullscreen = 0
; Sun shadow reach in metres, or stock for the stock 128 m clip. Restart required.
ShadowFarDistance = 256

[Terrain]
; Experimental visual-only micro relief (DX11 only). Off by default: its GPU cost is
; high at high resolutions. Opt-in. Restart required.
TerrainMicroRelief = 0
; Terrain replacement/proxy development is disabled for normal play. The four
; coordinate selectors use the runtime's INT_MIN sentinel explicitly so every
; supported key can remain present without constraining cluster selection.
TerrainProxyEnabled = 0
TerrainProxyZone = -1
TerrainProxyCluster = -1
TerrainProxyZoneX = -2147483648
TerrainProxyZoneZ = -2147483648
TerrainProxyClusterX = -2147483648
TerrainProxyClusterZ = -2147483648
TerrainProxyFollowCamera = 0
TerrainProxyFollowCameraAimDistance = 35.0
TerrainProxyFollowCameraReselectFrames = 300
TerrainProxyOffsetX = 0.0
TerrainProxyOffsetY = 0.0
TerrainProxyOffsetZ = 0.0
TerrainProxyVisible = 0
TerrainSemanticCapture = 0
TerrainSemanticDumpJson = 0
TerrainSemanticRenderer = 0
TerrainSemanticValidateUV = 0
TerrainSemanticLegacyUVQuantization = 0
TerrainSemanticDumpMismatches = 0
TerrainSemanticLifecycleLog = 0
TerrainSemanticDebug = 0
TerrainSemanticFrameCapture = 0
TerrainSemanticFrameCaptureStride = 300
TerrainSemanticFrameCaptureRequireOnScreen = 0
TerrainSemanticFrameCaptureMinCoverage = 0.005
; Native full-resolution diffuse tile replacement (DX11). Requires a texture
; pack manifest; existing tile placement, orientation and gameplay stay intact.
TerrainHdEnabled = 1
; Live Terrain Paint: fills HD terrain paint for maps with no pre-built paint entry,
; generated at load from the map. Needs HD Terrain Tiles and a pack with live recipes.
; DX11 Enhanced only; visual only. Off by default. Restart required.
; OPENSHIM_TERRAIN_PAINT_LIVE, when set, overrides this key.
TerrainPaintLive = 0
; "auto" finds the separately installed HD terrain pack (terrain_hd_tiles.json or
; cr_terrain_hd.json in the game folder, mods\, addon\, packaged_mods\ or a
; Workshop item) and mounts its textures. An explicit path overrides discovery.
TerrainHdManifest = auto

[DX11Enhanced]
; Optional extras on top of the Enhanced profile (the default on DX11). They are
; inert under RenderProfile = Redux or Retro and default OFF.
FXAA = 0
EnhancedLightSelectionV2 = 0
; Phase A scene-depth qualification. A diagnostic, not a feature: it
; records which D3D11 depth resources exist, what views are built over
; them and which render targets are bound alongside, so the main
; gameplay depth surface can be identified from evidence. Observation
; only - no resource description is modified - but it hooks three device
; entry points and the context, so leave it off outside a capture run.
SceneDepthDiagnostic = 0

[SunBaseline]
; Native Enhanced sun calibration (sun power and per-world colour grade) for
; any map, applied when the mission's sun is created. Enhanced profile on DX11
; only; Lua/EXU sun writes made later still win.
Enabled = 1
WorldColorGrading = 1
; Blank = the per-world default.
PowerScale =
; Blank = leave the engine's shadow far distance alone.
ShadowFarDistance =

[LocalDamage]
; Charred, ember-glowing hull marks where weapon hits land on craft
; (render only). Enhanced profile on DX11 only. See Docs/LOCAL_DAMAGE.md.
Enabled = 0
; 1 to 8 marks per unit.
MaxMarksPerUnit = 8
; Ember cool-down in seconds (0.5 to 60).
EmberSeconds = 6

[Display]
; Mesh-accurate impact effects. When a shot hits a craft, the impact sparks and
; explosion are drawn on the hull instead of on the engine's hit sphere. Hit
; outcome, damage and splash are unchanged, but the explosion object itself is
; moved, so this applies in single player only and stands down in network games.
; GOG only. Restart required. Default OFF.
MeshAccurateImpacts = 0
; Per-faction construction blobs. A build in progress draws the render effect
; (file.section, like muzzleRender) named by blobRenderA/S/C/B, or blobRender for
; every faction, in cnstblob.odf [ConstructionBlob], for the faction being built
; (first letter of its ODF), instead of the stock puff sprite. A faction without
; a key, or with a name that is not a render, keeps the stock puff. Display only.
; Restart required. Default OFF (stock).
FactionConstructionBlobs = 0
; Optional contextual HUD fading; groups brighten on relevant value changes.
; Each group: idle opacity 0-100%, delay 0-30000 ms, smooth fade 0-5000 ms.
WeaponListFade = 0
WeaponListIdleOpacity = 25
WeaponListFadeDelay = 2500
WeaponListFadeDuration = 500
ScrapHudFade = 0
ScrapHudIdleOpacity = 25
ScrapHudFadeDelay = 2500
ScrapHudFadeDuration = 500
PilotHudFade = 0
PilotHudIdleOpacity = 25
PilotHudFadeDelay = 2500
PilotHudFadeDuration = 500
; Command artwork/text hide together when idle; native command inputs reveal them.
CommandHudFade = 0
CommandHudIdleOpacity = 0
CommandHudFadeDelay = 2500
CommandHudFadeDuration = 500
; Independent cockpit meters; native critical warnings keep them visible.
HullHudFade = 0
HullHudIdleOpacity = 25
HullHudFadeDelay = 2500
HullHudFadeDuration = 500
AmmoHudFade = 0
AmmoHudIdleOpacity = 25
AmmoHudFadeDelay = 2500
AmmoHudFadeDuration = 500
; Cockpit radar: all layers fade together; native-visible alerts keep it visible.
RadarHudFade = 0
RadarHudIdleOpacity = 25
RadarHudFadeDelay = 2500
RadarHudFadeDuration = 500
RadarCompassAlwaysVisible = 0
; Main-menu image colorization. RGB 0-255; off preserves original artwork.
MenuTheme = 0
MenuThemeRed = 255
MenuThemeGreen = 0
MenuThemeBlue = 0
; Saturation 0-100%; white level 0-200% (100 preserves original brightness).
MenuThemeSaturation = 100
MenuThemeWhiteLevel = 100
; Player cockpit/chase base FOV in degrees, referenced to 4:3. 0 = stock 80.
; Accepts integers 60-120; widescreen expands horizontally. Restart required.
FieldOfView = 0
; Opt-in native reticle/hit feedback, currently GOG 2.2.301. Changes apply live.
; Style: Stock, Cross, Dot, CrossDot. Styling values do not tint/resize stock art.
ReticleStyle = Stock
ReticleColor = White
ReticleSize = 100
ReticleThickness = 2
ReticleOpacity = 100
ReticleOutline = 0
; Reaction and confirmed weapon hits; both also run in network games.
ReactiveReticle = 0
HitMarkers = 0
