; rename or reconnect does not undo it. Set to 0 for stock behaviour, where a
; mute lasts the session; /mute itself works either way, and an existing
; mutes.cfg is kept, not deleted.
PersistentPlayerMute = 1
; Lua Send/Receive of a map-authored object (geyser, beacon) that has no
; network id arrives as nil on every other player. 1 sends such objects by
; label instead, so scripts can pass them between peers. Stock peers still see
; nil, as before. 0 = stock behaviour.
LuaMapObjectHandles = 1
LobbyBzrnetIntegration = 0

; Restrict the multiplayer starting-vehicle list to the stock balanced
; factions. Local only; it never adds craft the map withheld.
StockFactionsOnly = 0
StockFactionSet = as

[Gameplay]
AllowNeutralAttackOrders = 0

[Updater]
; Stage a newer OpenShim from the Steam Workshop when the main menu first appears (Steam builds, never in multiplayer); it installs when you quit. 0 = manual "Check for Updates" only. Default: 1.
AutoStage = 1

[Career]
; Career persistence is a feature rather than a crash/bug/netcode fix.
StatsTracking = 0

[SinglePlayer]
; Experimental legacy-GEO vehicle contact for all supported craft. GOG only.
; Stock fallback for unsupported/changed models. Restart required. Default OFF.
VehicleGeometryContact = 0
; This section is hard-disabled by OpenShim in network games. Most behavior
; changes remain opt-in; narrowly proven Redux regressions may ship ON because
; the MP gate preserves mixed-client parity.
WeaponConvergence = 0
; Master switches for experimental authored GOG/SP cannon presentation.
; Restart required. No generic effects: mods must supply ODF configuration
; and matching assets. MuzzleFlash gates flashMesh plus muzzleRender smoke/light.
; Mesh flashes and recoil clips need EXU; native render effects/node slides do not.
MuzzleFlash = 0
MeshRecoil = 0
PlayerReticleConvergence = 0
; OpenShim's own range is single-player only. EXU SetReticleRange (BZP's
; longer reticle) is honored in network games and is not forced back to 200.
SmartReticleRange = 500
SmartScavengerPathing = 0
TurretAimPitch = 0
TurretAimPitchMultiplier = 0.95
; Proven Redux regression; hard-disabled in network games.
JumpSnipeCrouch = 1
; Projectiles inherit the velocity of whatever fired them, and the cannon lead
; solver subtracts the shooter's own velocity so a moving shooter still leads
; correctly. Changes projectile physics for every shot in the world, so it is
; an enhancement rather than a fix and ships OFF; hard-disabled in network
; games. If the cannon owner chain fails its runtime validation on a given
; build, the lead compensation stands itself down and only the spawn-velocity
; half stays active.
OrdnanceVelocityInheritance = 0
; Satellite view limits, as multiples of the stock values (0.25 - 8.0).
; ZoomOut raises only the maximum zoom, so the closest zoom stays stock.
; Hard-disabled in network games: pulling further out than a stock peer would
; show more of the map than that peer can see.
SatelliteZoomOut = 1.0
SatellitePanSpeed = 1.0
; weaponMask-aware AI weapon selection, off by default and forced off in
; network games. When on, the AI fires every fitted hardpoint the craft's
; weaponMask names, as one synchronized volley, instead of only the first.
; Not a no-op for stock content: the default mask 11111 means every fitted
; hardpoint, so a stock howitzer with four mortar hardpoints fires four
; rounds per cycle and consumes four times the ammo.
AiWeaponMaskArtillery = 0
AiWeaponMaskMinelayer = 0
AiOdfGameplayTuning = 0
BomberAiRange = 0
Turbo = 0
TurboTolerance = 0.9
Headlights = 0
OtherHeadlights = 0
HeadlightColor = Stock
HeadlightBeam = Stock
HeadlightBrightness = 1.00
; Flashlight on the player's pilot while on foot. No stock pilot skeleton
; carries an hlgt bone, so the engine never builds one; OpenShim creates the
; same kind of spotlight on the pilot's own scene node and destroys it when
; the player boards a craft or the mission ends. The beam follows the aim
; because the pilot's node carries look yaw and pitch.
PilotFlashlight = 0
; Stock, White, Red, Green, Blue, Yellow, Cyan, Magenta, Orange, Purple,
; Teal, Rainbow, or an r,g,b triple. Stock is the brightness the engine
; writes for a craft headlight.
PilotFlashlightColor = Stock
; Stock, Focused (narrow) or Wide.
PilotFlashlightBeam = Stock
; Extra node-local offset in metres, x,y,z, added to the source bone.
; Positive x is the pilot's right, positive y up, negative z forward.
PilotFlashlightOffset = 0,0,0
; Degrees above (+) or below (-) the aim line.
PilotFlashlightPitch = 0
; Case-insensitive bone-name suffix the light's offset is taken from.
; 11POV is the stock pilots' eye bone (asp11POV / bsp11POV / ssp11POV).
PilotFlashlightBone = 11POV
; Keep your pilot on your own team while boarding a craft. Boarding restores
; the pilot's team from a 4-bit field packed in the low-level object's flags
; rather than leaving its live team alone, and Team::FriendP rejects team 0
; outright, so a pilot whose packed team reads 0 is briefly hostile to your
; own weapon mines -- which is what fires an allied Arc Mine at the spot you
; just boarded from. This repairs the packed field while you are on foot and
; never touches the boarding call.
; CONFIRMED LIVE 2026-09-13. On foot the pilot reads team 1; on the very first
; frame after boarding it reads -1. GameObject::FriendP(int) guards on
; `-1 < team`, so a pilot reading -1 is nobody's friend and a weapon mine on
; your own team accepts it as a target -- which is the allied Arc Mine firing at
; the spot you just boarded from, doing no damage to the craft because what it
; is shooting is the dying pilot. This restores the pilot's team for the few
; frames it is still reachable. Confirmed on the scripted test route, not yet on
; a hand-driven boarding, so it still ships OFF.
; Hard-disabled in network games. See openshim.ini.example for the full note.
PilotTeamRestore = 0
AttackRevealPerceivedTeam = 0
; Proven satellite fog-of-war regression; hard-disabled in network games.
SatelliteVisibilityFix = 1

[Testing]
; Developer/test aids. Leave OFF for normal play.
RunInBackground = 0

[Experimental]
; Unfinished work, off by default and safe to leave alone, except GpuSkinning,
; which is finished enough to ship on.
;
; InteractiveFogWakes: hovercraft carve a clearance trail through ground fog.
; This build maintains the CPU simulation only -- nothing is rendered yet -- so
; enabling it changes no pixels. It exists so the simulation can be observed and
; qualified before any GPU work is attempted. See Docs/INTERACTIVE_FOG_WAKES.md.
InteractiveFogWakes = 0
;
; GpuSkinning: skin animated craft on the GPU (Direct3D 11 only) instead of the
; CPU. On by default: it saves CPU time with many craft on screen (about +30%
; fps in a 40-craft fight). Takes effect on the next mission load. Edges can
; differ from stock by a fraction of a pixel; anything it cannot convert safely
; stays on the CPU path. Set 0 to use the stock CPU path.
GpuSkinning = 1
;
; GpuInstancing: with GpuSkinning on, draw craft of the same model together in
; one draw call (Direct3D 11 only). Experimental. Takes effect on the next
; mission load.
GpuInstancing = 0
;
; MouseEveryFrame: apply mouse steer and pitch every frame instead of in 1/60 s
; batches, so mouse aim follows high refresh rates. Sensitivity is unchanged.
; Single player only; ignored in network games.
MouseEveryFrame = 0
;
; DynamicGeometryMaterialCache: skip the material name lookup when an effect
; asks for the material its current piece already holds. Pixel-identical, but
; it never engaged in measured combat (about 10 name lookups per frame), so it
; stays off.
DynamicGeometryMaterialCache = 0

[Environment]
; Raw OPENSHIM_* / BZR_* compatibility variables may be supplied here when a
; legacy launch script or one-off developer probe requires them. Normal players
; should leave this section empty and use the first-class settings above.
[ODF]
; Battlezone 98 Redux reads ODF keys only under exact section names, while
; 1.5 tolerated legacy spellings ([MagnetClass], [FlareBuildingClass],
; [ScavengerCraftClass], [SprayBuildngClass], bare [GameObject]/[SprayBomb]).
; LegacySectionRemap renames those headers to canonical form as ODFs load so
; legacy mods resolve again. Off by default: stock behavior is Redux-strict.
LegacySectionRemap = 0
; LogUnknownOdfSections reports section headers seen in neither the loader
; set nor the retail corpus (once per file+section). Diagnostic only.
LogUnknownOdfSections = 0
; CrashValueGuards clamps ODF values verified to crash engine code
; (MagnetMine fieldRadius 0, negative ChargeGun ordnanceCount / Launcher
; targetCount) and reports FlareMine/SprayBuilding sections missing
; payloadName. Off by default.
CrashValueGuards = 0
