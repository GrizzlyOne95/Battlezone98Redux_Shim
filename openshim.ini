; ============================================================================
; OpenShim Player Configuration
; ============================================================================
; Conservative player defaults. Every first-class openshim.ini setting is
; present here so users can enable supported OpenShim behavior without starting
; from the developer reference.
;
; Shipping-default policy:
;   - crash prevention, stability fixes, and qualified Redux bug fixes default
;     ON unless they can substantially alter multiplayer behavior or create a
;     mixed-client difference against players who are not running OpenShim;
;   - qualified netcode fixes default ON;
;   - the native keybind UI and OpenShim Settings UI default ON because they are
;     the supported way to reach all other settings;
;   - every other enhancement, presentation change, gameplay change, autosave,
;     diagnostic, experimental feature, and convenience feature defaults OFF;
;   - stock-preserving controls keep their stock value even when that value is
;     numerically 1 (for example AllowStartupAutoLoad and SunFlashbang).
;
; See openshim.ini.example for accepted values, aliases, ranges, restart
; requirements, implementation notes, and raw compatibility variables.
;
; Policy details:
;   - [Fixes] is not blanket-enabled: each default-ON fix must be individually
;     safe under the rule above. Fixes with unresolved or material mixed-client
;     multiplayer impact remain OFF until they are gated or qualified;
;   - [SinglePlayer] normally defaults OFF, but a proven Redux regression may
;     default ON when OpenShim hard-disables it for network games;
;   - renderer selection remains automatic and the visual profile remains the
;     stock-compatible Redux profile. DX11 Enhanced subfeatures remain OFF until
;     explicitly enabled with that profile;
;   - GovernorTuning remains OpenShim as part of the qualified netcode baseline;
;     set it to Stock for strict stock governor/auto-kick behavior, while net.ini
;     remains the granular authority;
;   - values that only tune a disabled master switch remain present so users can
;     enable that feature without reconstructing its configuration.
;
; Preset revision:
;   This player preset was first introduced in commit e81d8b0a (2026-08-27) but
;   that revision was never merged to main, never tagged as a release, and
;   never shipped via Workshop or the verified static-patches.json release
;   workflow. Repository history (git log --all -- openshim.ini, tag v2.2.301
;   assets, CampaignReimagined InstallerPayload/manifest) contains no
;   openshim.ini payload prior to this branch, so no public preset with a bad
;   default has been proven to have shipped. Nonetheless the migration
;   framework below treats e81d8b0a's content as revision 1 (bad) and the
;   corrected preset lineage as revision 2/3 so the mechanism is qualified
;   before any future problematic preset can reach users. This policy adjustment
;   does not forcibly rewrite existing customized user INIs.
; ============================================================================
; OpenShimPresetRevision = 4

[General]
SoundChannels = 0
CustomBindsUi = 1
; The OpenShim Settings page in Redux Options. This one stays ON because it
; is how a player reaches every other switch in this file without editing it
; by hand; the settings it exposes remain OFF until turned on there.
SettingsUi = 1
ChunkMeshes = 0
; Generated chunk mesh cache (openshim/cache/chunks) is pruned at startup.
; Size cap in MB (0 = no cap) and days unused before a model folder expires (0 = never).
ChunkCacheMaxMB = 256
ChunkCacheMaxAgeDays = 30
; Person deaths as rigid limb gibs (visual only). An enhancement, so OFF in
; this preset; the feature itself defaults ON when the key is absent.
SkinnedGibs = 0
SkinnedGibsMax = 160
SkinnedGibsLinger = 8
SkinnedGibsForce = 1.0
; Brass casings ejected by cannon-like weapons (visual only). An
; enhancement, so OFF in this preset and when the key is absent.
ShellCasings = 0
ShellCasingsMax = 48
ShellCasingsLinger = 6
ShellCasingsClasses = cannon,mortar,machinegun,snipergun,-gquake,-gsandbag

; AI path grid follows collision faces for ODFs with pathBlock = "faces"
; (tunnels, arcades, walk-in rooms). Opt-in per ODF, so ON.
PathBlockFaces = 1
; Menu screens (Instant Action, Multiplayer, Custom Campaigns) open and close
; without the Modable material rebuild; content still loads in full before a
; mission starts and in the multiplayer game room.
FastMenuTransitions = 1
; Multiplayer map-list refresh/jump and selection-preservation bug fixes.
MapRefreshFixes = 1
; Adds "5+ Players", "Stock Maps" and a map search box to Create Game.
MapFilterExtras = 0
MusicGlobalFocus = 1
; Set to 1 to bypass the legacy smoothed/accelerated mouse-message path and
; use Redux's native raw-input path. Restart the game after changing it.
RawMouseInput = 0
; Set to 1 for BZ2-style "Control Smoothing: Off": steer, aim, throttle and
; strafe follow input directly instead of easing toward it. Restart required.
DisableControlSmoothing = 0
OgreMaterialCollisionGuard = 1
; Restores the BZ 1.5 overhead-view / control-panel display order, which is
; what makes editor object placement work in the running Shift+F10 overhead
; view. Inert unless the game was launched with /edit. Restart required.
EditorOverheadPlacementOrder = 1
; World Builder saves go back to the folder the map was loaded from, after a
; prompt that shows the real destination (Cancel is the default). 0 keeps
; stock: saves land in the root addon folder. Restart required.
EditorSaveToSourceFolder = 1
; 0 keeps the stock behavior: hopping out replays one stale under-attack growl
; for the craft you just left. Set to 1 to suppress that single alert.
SuppressHopOutAttackAlert = 0

[Fixes]

; Say why the main-menu multiplayer entry reads "Not Ready". Stock has no
; way to say: its readiness getter returns only ready/not-ready, so platform
; sign-in, service transport and a refused sign-in all look identical. This
; reports the term that actually failed in the shell's own MPStatus text,
; directly under the entry -- no hover, it is ordinary on-screen text.
; Contained: exactly one of the 41 call sites reads the readiness value, and
; only the one message lookup is redirected. Byte-guarded on both sites; a
; mismatch stands the explainer down and leaves the diagnostic reporting.
; The messages are English only -- naming the real term is worth more than a
; localized string that can only ever say one of two wrong things.
; Accepted: boolean. Default: ON -- testers who hit this have no other
; way to report a reason. Set to 0 to restore the bare stock "Not Ready".
; Env override to disable: OPENSHIM_NO_EXPLAIN_MP_NOT_READY
ExplainMultiplayerNotReady = 1
; Confirmed Redux engine defects. Default ON only when the fix is safe under the
; shipping policy above. Simulation-affecting fixes that are explicitly gated
; out of network games may ship ON; fixes that can materially change mixed-client
; multiplayer behavior remain OFF until gated or qualified.
;
; They remain individually switchable so a suspected regression can be bisected
; without removing OpenShim.
;
; Mixed/custom producer registration changes AI production and is not currently
; network-gated, so it remains opt-in despite being a real engine defect.
AiMultiProducerMakers = 0
; The following eight touch simulation but stand down automatically in network
; games, preserving stock/OpenShim mixed-client behavior.
ApcAlliedTargetDeploy = 1
SplinterUndead = 1
OwnedObjectReveal = 1
HowitzerUndeployedRetaliation = 1
TugCargoPostLoad = 1
ConstructorRemoteBuild = 1
; Step the simulation by the measured frame time instead of whole milliseconds
; (stock steps 6, 7, 7 ms at 144 fps). Game time is unchanged.
PreciseTimestep = 1
; Decode a new music track's first 3 s once instead of twice; shortens the
; main-thread hitch at each track change. Client-local audio.
MusicSingleFill = 1
; Two constructors ordered to recycle the same building each run their own
; unbuild countdown. The first to finish deletes the building; stock never
; clears the loser's unbuild handle, so it stays deployed for the rest of the
; mission, accepting orders it can never act on. Releases that stale handle.
ConstructorRecycleStaleTarget = 1
; Defensive crash/stability guard for invalid/non-positive magnet ranges.
MagnetZeroRangeGuard = 1
; Heap-corruption guard: remote scavenger NetProcess is not a ScavengerProcess.
ScavengerNetProcessGuard = 1
; Stock Lua Formation(unit, leader, priority) reads the leader as an integer and raises
; "number expected, got userdata". Repairs the binding (GOG Redux 2.2.301 only).
LuaFormationBinding = 1
; Lua Send strings/tables of 128..255 entries crashed every receiver (signed length
; byte). Reads the byte unsigned; refuses lengths above 255 at the sender.
LuaSendLengthUnsigned = 1
; Client-side only: release the OS cursor while Redux is minimized or unfocused.
UnfocusedMouseRelease = 1
; Renderer only: craft meshes get their real bounding box back instead of the
; infinite one Redux gives them, so off-screen and distant craft stop being
; drawn and shadowed. No gameplay effect.
RestoreCraftBounds = 1
; Renderer only: effect-sprite batching CPU savings, pixel-identical output.
; Reuse the current DynamicGeometry piece when the depth key matches, and sort
; pieces without calling into OgreMain per compare.
DynamicGeometryPieceReuse = 1
DynamicGeometryFastSort = 1
; Register the frame thread with MMCSS ("Games") and opt out of Windows power
; throttling. Scheduling only; no simulation effect.
ThreadScheduling = 1
; Script-visible producer predicates can change mission branching in MP.
ProducerScriptPredicates = 0
; Reload the multiplayer starting-vehicle list from mod-scoped assets
; (patches 1/4, 2/4, 4/4). Off by default: that reload replaces BZP/BZP-T's
; faction-only waiting-room .vxt (NSDF/CCA/BDOG/CRA/Observer) with stock
; ships. Patch 3/4 (always-update the vehicle select control) stays applied
; and is not the map-list wheel. Turn this on for workshop maps that need
; the vehicle list to follow the selected mod.
VehicleListModScoping = 0
; Command-line parser repair; no gameplay or mixed-client divergence.
CliMultiParameterOptions = 1
; el_detail_atlas.csv and ga_detail_atlas.csv place four tile rectangles at
; 0.825 instead of 0.875, so those tiles straddle an atlas cell boundary and
; show half of the neighbouring texture. Hands Redux a corrected copy at open
; time; the shipped file is never written. Off until the redirect is confirmed
; on a live run -- the correction itself is verified against all 11 atlases.
TerrainAtlasRectRepair = 0
; The multiplayer Create Game vehicle preview inherits a PSSM material scheme
; on a viewport that has shadows disabled, so its shader reads NaN shadow
; matrices and the craft renders as NaN - black - with every submission,
; face and draw-call counter looking healthy. Pins that viewport to the
; matching -noshadow scheme. Verified from a RenderDoc capture.
MpVehiclePreviewShadowScheme = 1
; The Enhanced/Retro profiles rewrite a viewport's material scheme to the
; en-/og- technique family. Only materials that declare those techniques can
; satisfy it, so a Workshop or converted legacy map whose terrain inherits
; stock BZTerrainBase has no match, and Ogre falls back to the material's
; FIRST technique - which is `scheme high-pssm`. Its pass reads shadow
; matrices that were never set up on that viewport, so the sm4 shader writes
; NaN and the terrain renders black on DX11 while DX9 looks correct. This
; answers the scheme miss with the material's own base-scheme technique
; instead, via Ogre's handleSchemeNotFound hook.
EnhancedSchemeFallback = 1
; Automatic DX11 legacy material compatibility for old mods. Off until the
; live DX11 mod corpus qualifies cached technique instantiation; the probe
; fails closed to bounded diagnostics until then. See openshim.ini.example.
DX11LegacyMaterialCompat = 0
; DX11 shaderless-draw safety guard. Bounds per-draw exception spam into
; once-only [DX11COMPAT] diagnostics; changes no pixels by itself.
DX11ShaderlessDrawGuard = 1
; Aggressive generic fallback for unknown custom shaders. Opt-in only: it
; intentionally replaces unknown semantics with a generic approximation.
DX11LegacyMaterialAggressive = 0

