[Network]
; OpenShim's qualified socket layer: winsock hooks, bandwidth governor,
; auto-kick relaxation, packet reorder/duplicate mitigation and DSCP marking.
; Set to 0 for stock networking -- nothing below in this file's socket layer
; installs, and net.ini is not consulted for it. This is the switch to try
; first when diagnosing a connection problem.
NetImprovements = 1

; Which tuning the bandwidth governor and host auto-kick run.
;   OpenShim = OpenShim's measured tuning
;   Stock    = leave every governor and auto-kick value at the game's own
;
; Use Stock for strict stock governor/auto-kick parity. net.ini still overrides
; this for granular tuning.
GovernorTuning = OpenShim

; Sends each new reliable P2P message immediately even while older ones are
; being retransmitted. Stock holds it for the next 2.5 s retry pass, and every
; position update queued behind it is dropped meanwhile: the 100% loss / huge
; ping seen in 3+ player games. Sender-side only, same wire format.
ReliableSendBacklogFix = 1

; Reliable resend timers in ms (stock 1000 / 2500). Lower values shorten the
; update blackout after a lost packet on a lossy connection.
; Independent of ReliableSendBacklogFix. Decimal 50-10000 only; invalid values
; keep stock. Shipped at 300 / 800 since 2026-10-19; 1000 / 2500 restores stock.
ReliableFirstRetryMs = 300
ReliableRetryIntervalMs = 800

; BZRNet P2P early unreliable receive. Stock Redux accepts a packet only when
; its stamp is the next reliable stamp it expects, and unreliable updates carry
; the sender's next reliable stamp. So after one lost reliable fragment every
; position update on that link is discarded until the retransmit arrives: a
; round trip after the receiver's NAK, or up to the retry timers above when the
; NAK is lost as well. On, an unreliable single-fragment update stamped past
; the missing fragment is delivered instead; the NAK is still sent, reliable
; messages stay strictly ordered, and stale updates are still discarded.
; Receiver-side only: the wire format and the sender are unchanged, so it is
; safe with stock peers. Updates may now be applied before an earlier reliable
; message that is still being retransmitted. Logs [P2PRECV] totals.
; Accepted: boolean. Default: ON (live-qualified 2026-10-10: loss, 256 kbit/s,
; WAN). Restart required.
; Kill switch: OPENSHIM_DISABLE_EARLY_UNRELIABLE_ACCEPT (or BZR_ prefix).
; Sites: GOG 2.2.301 0x0075DA8D and 0x0075DB96; a signature mismatch keeps stock.
EarlyUnreliableAccept = 1

; BZRNet P2P early NAK receive. When a receiver drops an out-of-order packet it
; sends a NAK (kind 6) that makes the sender retransmit at once, but the NAK
; carries the requester's next reliable stamp and stock discards it silently
; unless every reliable message the requester sent has already arrived. With
; reliable traffic in flight both ways that is rarely true (91% of NAKs were
; discarded in a 3%-loss battle), so lost reliable messages wait for the
; ReliableFirstRetryMs / ReliableRetryIntervalMs timers instead. On, a NAK
; stamped ahead is accepted and triggers the immediate resend it asks for.
; Each resend pass is still capped at 5000 bytes / peer count. Receiver-side
; only, same wire format, safe with stock peers. Logs [P2PRECV] totals.
; Accepted: boolean. Default: ON since 2026-10-19 (3x lower reliable p95 on
; low-RTT lossy links; at WAN round trips a smaller gain for about +40% resend
; bytes). Restart required.
; Kill switch: OPENSHIM_DISABLE_EARLY_NAK_ACCEPT (or BZR_ prefix).
; Site: GOG 2.2.301 0x0075DA88; a signature mismatch keeps stock.
EarlyNakAccept = 1

; Repeat NAKs for the same missing message are ignored for this long, so one
; loss triggers one immediate resend instead of one per dropped follower
; (each resend pass re-sends the whole unacknowledged queue). A repeat after
; the holdoff is honoured (the retransmission itself was lost).
; Accepted: decimal 50-10000 ms. Default: 300. Used only with EarlyNakAccept.
EarlyNakHoldoffMs = 300

; A NAK for a missing message triggers a resend only if the peer is still
; asking for that message this long after its first NAK. A datagram that was
; merely late or reordered arrives inside the window and causes no resend
; pass. 0 resends on the first NAK.
; Accepted: decimal 0-1000 ms. Default: 0 (40 raised reliable p99 about 2x in
; every impaired profile). Used only with EarlyNakAccept.
EarlyNakReorderMs = 0
RoutePreference = Stock
UdpPort = 0
; Blank = use the Steam/GOG account name.
