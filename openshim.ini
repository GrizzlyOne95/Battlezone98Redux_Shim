[Network]
; In-process LAN host and local identities; no Steam/Galaxy sign-in or helper.
; Requires an explicit LAN selection and numeric private IPv4. Development opt-in.
NoAuthLan = 0

; Let .tga files pass the multiplayer mod asset whitelist, so a visual-only
; (sky/texture) Workshop mod holding .tga files still mounts in a network game.
; Peers without this setting still reject such a mod, so players can see
; different visuals; the simulation does not read .tga files.
; Accepted: 0/1. Default: 1. Restart required after changing.
AllowTgaInMultiplayerMods = 1
; OpenShim's qualified socket layer: winsock hooks, bandwidth governor,
; auto-kick relaxation, packet reorder/duplicate mitigation and DSCP marking.
; Set to 0 for stock networking -- nothing below in this file's socket layer
; installs, and net.ini is not consulted for it. This is the switch to try
; first when diagnosing a connection problem.
NetImprovements = 1

; Which tuning the bandwidth governor and host auto-kick run.
;   OpenShim = OpenShim's measured tuning
;   Stock    = leave every governor and auto-kick value at the game's own
;
; Use Stock for strict stock governor/auto-kick parity. net.ini still overrides
; this for granular tuning.
GovernorTuning = OpenShim

; Sends each new reliable P2P message immediately even while older ones are
; being retransmitted. Stock holds it for the next 2.5 s retry pass, and every
; position update queued behind it is dropped meanwhile: the 100% loss / huge
; ping seen in 3+ player games. Sender-side only, same wire format.
ReliableSendBacklogFix = 1

; Reliable resend timers in ms (stock 1000 / 2500). Lower values shorten the
; update blackout after a lost packet on a lossy connection.
; Independent of ReliableSendBacklogFix. Decimal 50-10000 only; invalid values
; keep stock. Shipped at 300 / 800 since 2026-10-19; 1000 / 2500 restores stock.
ReliableFirstRetryMs = 300
ReliableRetryIntervalMs = 800

; Raise both waits above to 1.5x that peer's round trip when that is larger,
; so a high-ping link only resends real losses (at 350 ms ping a fixed 300 ms
; first retry fires before the ACK can arrive). Low ping is unchanged. Sender
; side, same wire format. 0 keeps the fixed waits. Restart required.
ReliableRetryAdaptToPing = 1

; BZRNet P2P early unreliable receive. Stock Redux accepts a packet only when
; its stamp is the next reliable stamp it expects, and unreliable updates carry
; the sender's next reliable stamp. So after one lost reliable fragment every
; position update on that link is discarded until the retransmit arrives: a
; round trip after the receiver's NAK, or up to the retry timers above when the
; NAK is lost as well. On, an unreliable single-fragment update stamped past
; the missing fragment is delivered instead; the NAK is still sent, reliable
; messages stay strictly ordered, and stale updates are still discarded.
; Receiver-side only: the wire format and the sender are unchanged, so it is
; safe with stock peers. Updates may now be applied before an earlier reliable
; message that is still being retransmitted. Logs [P2PRECV] totals.
; Accepted: boolean. Default: ON (live-qualified 2026-10-10: loss, 256 kbit/s,
; WAN). Restart required.
; Kill switch: OPENSHIM_DISABLE_EARLY_UNRELIABLE_ACCEPT (or BZR_ prefix).
; Sites: GOG 2.2.301 0x0075DA8D and 0x0075DB96; a signature mismatch keeps stock.
EarlyUnreliableAccept = 1

; BZRNet P2P early NAK receive. When a receiver drops an out-of-order packet it
; sends a NAK (kind 6) that makes the sender retransmit at once, but the NAK
; carries the requester's next reliable stamp and stock discards it silently
; unless every reliable message the requester sent has already arrived. With
; reliable traffic in flight both ways that is rarely true (91% of NAKs were
; discarded in a 3%-loss battle), so lost reliable messages wait for the
; ReliableFirstRetryMs / ReliableRetryIntervalMs timers instead. On, a NAK
; stamped ahead is accepted and triggers the immediate resend it asks for.
; Each resend pass is still capped at 5000 bytes / peer count. Receiver-side
; only, same wire format, safe with stock peers. Logs [P2PRECV] totals.
; Accepted: boolean. Default: ON since 2026-10-19 (3x lower reliable p95 on
; low-RTT lossy links; at WAN round trips a smaller gain for about +40% resend
; bytes). Restart required.
; Kill switch: OPENSHIM_DISABLE_EARLY_NAK_ACCEPT (or BZR_ prefix).
; Site: GOG 2.2.301 0x0075DA88; a signature mismatch keeps stock.
EarlyNakAccept = 1

; Repeat NAKs for the same missing message are ignored for this long, so one
; loss triggers one immediate resend instead of one per dropped follower
; (each resend pass re-sends the whole unacknowledged queue). A repeat after
; the holdoff is honoured (the retransmission itself was lost).
; Accepted: decimal 50-10000 ms. Default: 300. Used only with EarlyNakAccept.
EarlyNakHoldoffMs = 300

; A NAK for a missing message triggers a resend only if the peer is still
; asking for that message this long after its first NAK. A datagram that was
; merely late or reordered arrives inside the window and causes no resend
; pass. 0 resends on the first NAK.
; Accepted: decimal 0-1000 ms. Default: 0 (40 raised reliable p99 about 2x in
; every impaired profile). Used only with EarlyNakAccept.
EarlyNakReorderMs = 0

; Keeps a running match when only the lobby websocket drops. Gameplay is P2P;
; stock still quits ("Lost connection to game") the moment the websocket
; closes, even though it reconnects within a second. While a mission is
; running and a peer answered one of the last two P2P pings (about 6 s), the
; local lobby leave is skipped, and a remote player whose lobby session ended
; is kept while their P2P is live (kicks and bans still drop). A real P2P
; loss still ends the session through the stock ping check and host
; auto-kick. A kept player is re-checked at each ping and dropped once they
; have answered none of the last 10 pings, so a player who quits is still
; removed (10 ping intervals: 6 s at 600 ms, up to 30 s at the 3000 ms cap).
; One still answering after max(10 s, 15 ping intervals) stays.
; Accepted: boolean. Default: ON (stock behaviour is a defect; inert unless
; the websocket drops mid-match). Restart required.
; Kill switch: OPENSHIM_DISABLE_LOBBY_DROP_KEEPS_MATCH (or BZR_ prefix).
; Sites: GOG 2.2.301 0x006BF11B, 0x0073F13F, 0x005718C7; a signature mismatch keeps stock.
LobbyDropKeepsMatch = 1
; Keeps a Lua LockAllies(true) made in Start() (multiplayer/co-op). Stock rebuilds the
; ally editor after Start() and zeroes the lock, so Y/U could still ally; 1.5 kept it.
; Accepted: boolean. Default: ON (stock bug fix). Restart required.
; Kill switch: OPENSHIM_DISABLE_ALLY_LOCK_SURVIVES_START (or BZR_ prefix).
; Site: GOG 2.2.301 0x00681E2A; a signature mismatch keeps stock.
AllyLockSurvivesStart = 1
RoutePreference = Stock
UdpPort = 0
; Blank = use the Steam/GOG account name.
Nickname =
; The network route readout sits in the empty left column of the
; waiting room. That does not cover BZP's faction picker; leave this on.
LobbyReadouts = 1
; The Ban User button does sit on the faction/vehicle cluster.
; Leave it off for BZP/BZP-T. /ban still works.
LobbyBanButton = 0
; Multiplayer opens a setup screen first (nickname, flag, server status)
; instead of going straight to the lobby. Default on; 0 = stock behaviour. While the
; network is Not Ready the button opens the setup screen anyway, so the
; server can be switched or the connection retried.
PreLobby = 1
; Seconds the game waits between matchmaking connect retries (stock 30).
; 0 = stock. A custom server that does not answer falls back to Rebellion
; for the session; the saved choice is kept. LAN keeps retrying its local host.
ReconnectDelaySeconds = 5
; Look up the matchmaking server by IPv4 only. With IPv6 enabled Windows also
; asks for an IPv6 address the server does not have; when that query stalls
; past the game's 5 s lookup timer, the multiplayer tab stays Not Ready. Falls
; back to the normal lookup if IPv4 finds nothing. 0 = stock lookup.
ForceIPv4Matchmaking = 1
; Matchmaking server picked on the multiplayer setup screen: Rebellion,
; Custom, Local (127.0.0.1), or LAN (selected by the LAN browser).
; Blank = stock (the /bzrserver= launch switch, else Rebellion's).
Server =
; Custom server host or IP, optionally :port (default 1337; the server's UDP
; probe port must be that + 1). Used when Server = Custom or LAN.
; Your Steam/GOG sign-in ticket is withheld from every non-Rebellion server
; (this, /bzrserver= and the test redirect alike); it needs NetImprovements.
CustomServer =
; Muted players stay muted after a restart, keyed by stable identity so a
; rename or reconnect does not undo it. Set to 0 for stock behaviour, where a
; mute lasts the session; /mute itself works either way, and an existing
; mutes.cfg is kept, not deleted.
PersistentPlayerMute = 1
; Ignore the free camera key (Shift/Ctrl+F11) in multiplayer so nobody scouts
; with it. Set to 0 for stock. Enforced by your own game only.
BlockFreeCamInMultiplayer = 1
; Sent only to community (non-official) matchmaking servers, never to
; Rebellion's: a per-server key that lets a server recognise you across
; sessions. Each server gets a different key, so servers cannot link you. The
; secret behind it is openshim_community.key next to this file; keep it
; private. Deleting it gives you a new identity. 0 = send no key.
CommunityIdentityKey = 1
; Lua Send/Receive of a map-authored object (geyser, beacon) that has no
; network id arrives as nil on every other player. 1 sends such objects by
; label instead, so scripts can pass them between peers. Stock peers still see
; nil, as before. 0 = stock behaviour.
LuaMapObjectHandles = 1
LobbyBzrnetIntegration = 0

; Restrict the multiplayer starting-vehicle list to the stock balanced
; factions. Local only; it never adds craft the map withheld.
StockFactionsOnly = 0
StockFactionSet = as

; Smooths remote players and units on this machine with a time constant (ms)
; instead of stock's fixed per-frame blend, so motion looks the same at any
; frame rate. Display only. 0 = stock. Try 100.
RemoteSmoothingMs = 0

[Mods]
; Also mount every subfolder of an addon/mods/packaged_mods/Workshop mod folder,
; not just its top level. Duplicate file names: the shallowest folder wins,
; then alphabetical order (a warning is logged). In a network game a subfolder is
; mounted only if every file in it passes the MP asset whitelist. Peers without
; this setting do not mount the subfolders at all.
; Accepted: 0/1. Default: 0. Restart required after changing.
RecurseModSubfolders = 0

