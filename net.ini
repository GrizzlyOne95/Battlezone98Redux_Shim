; net.ini  -  OpenShim low-level socket optimizer and packet-stability lab.
; Copy this file next to battlezone98redux.exe / BZR.exe.
;
; Scope note: this file is the SOCKET layer. User-facing multiplayer settings
; (route preference, UDP port, nickname, lobby readouts) and the relay-logging
; master toggle live in openshim.ini; see that file's [Network] and
; [Diagnostics] sections. Every key here is also honoured from the process
; environment under its BZ_* / OPENSHIM_* legacy name.
;
; IMPORTANT: packet reordering is disabled by default. The current reorder
; implementation is experimental: its wire sequence interpretation is not yet
; sufficiently validated, and overlapped WSARecvFrom traffic bypasses it.
; Enable it only for controlled testing with logs and captures.
;
; Packet duplication is deprecated/experimental and remains disabled. It can
; increase burst pressure and may make constrained uplinks worse.
;
; Buffer/relay captures can contain packet payload fragments, public endpoints,
; lobby metadata, and other sensitive network information. Keep captures local,
; review them before sharing, and obtain consent from other participants.

; ---------------------------------------------------------------------------
; [Net] is the GAME's own tuning block, not OpenShim's.
;
; It is reproduced here for reference and for hosts running without the shim.
; Do not rely on it: the game only parses net.ini through the mod system, and
; only for the session's active mod, so a copy in the game folder root is
; silently ignored and even a correctly placed copy has been observed not being
; applied. OpenShim therefore writes these values straight into the game's
; .data globals instead -- see the Net* keys in [OpenShimSocket] below, which
; are what actually takes effect and which override whatever is written here.
; ---------------------------------------------------------------------------
[Net]
MaxPing=450
UpCount=100
DownCount=50
MinBandwidth=16000
MaxBandwidth=320000
MaxPingsLost=60
AutoKickStart=60000
AutoKickPing=2000
AutoKickLoss=200
AutoKickTime=60000
UseCompression=1

[OpenShimSocket]

; ---------------------------------------------------------------------------
; Socket options
; ---------------------------------------------------------------------------
; Master switch for the socket optimizer. Default: 1.
EnableSocketOptimizer=1
; DSCP marking on outbound traffic. 0..63. 46 = Expedited Forwarding.
Dscp=46
; TCP_NODELAY / SO_KEEPALIVE / SIO_UDP_CONNRESET suppression. Default: 1.
EnableTcpNoDelay=1
EnableKeepAlive=1
DisableUdpConnReset=1
; Socket buffer floors, in bytes. Both are raised to at least 32768.
ApplySocketBuffers=1
SendBufferSize=262144
ReceiveBufferSize=262144

; ---------------------------------------------------------------------------
; Logging volume
; ---------------------------------------------------------------------------
EnableLogging=1
LogSocketErrors=1
LogSocketLifecycle=1
LogSocketPackets=1
LogSockOptCalls=1
LogPacketReorder=1
; Packet logging is sampled: the first PacketLogLimit packets on a socket, then
; every PacketLogInterval-th. Set the interval to 0 to log only the first few.
PacketLogLimit=16
PacketLogInterval=128

; ---------------------------------------------------------------------------
; The game's [Net] tunables, written directly into .data
; ---------------------------------------------------------------------------
; These are what actually reach the game; the [Net] block above does not
; reliably. Each address is gated twice: the build is confirmed by a unique
; 15-byte governor signature, and each individual global is checked for a
; plausible value on first contact and vetoed rather than written if it looks
; wrong. Look for "net_globals:" lines in the log to see what was applied,
; what the game held beforehand, and what was vetoed.
;
; 0 on any key means "leave the game's own value alone".
;
; NetTune supplies the defaults for the six governor/bandwidth keys; setting an
; individual key always wins over it.
;
; If NetTune is absent here, its default comes from openshim.ini
; [Network] GovernorTuning (OpenShim = 1, Stock = 0). Setting it in this file
; overrides that, so net.ini stays the granular authority.
NetTune=1
; Collapse floor. The stock 4000 lets one bad stretch drop the send rate to a
; trickle and takes minutes to climb back; 16000 keeps game state flowing
; during recovery and lifts the floor clear of the cold-start sentinel.
NetMinBandwidth=16000
; Ceiling. 320000 effectively removes the cap. The governor is closed-loop --
; it only climbs while ping < NetMaxPing -- so a high ceiling is not a risk,
; while a low one has been measured sitting below real traffic and making the
; governor fight it for whole matches.
NetMaxBandwidth=320000
; Ramp. Recovery must outpace back-off or a traffic spike ratchets the rate
; down and never lets it back up. 100/50 keeps stock's 2:1 up-bias at 10x scale.
NetUpCount=100
NetDownCount=50
; Ping ceiling before the governor starts cutting. Stock 300 turns a jitter
; spike into a rate cut into more queueing into a bigger spike.
NetMaxPing=450
; Left alone by default; no evidence a change helps.
NetMaxPingsLost=0

; ---------------------------------------------------------------------------
; Auto-kick (host-enforced: only the hosting machine's values matter)
; ---------------------------------------------------------------------------
; A tick is bad when ping > AutoKickPing OR loss > AutoKickLoss; bad
; continuously for AutoKickTime and the host ejects the player.
;
; These are the relaxed values. Tighter numbers (~2x stock) were tried and
; ejected a live player twice in one evening, both times at exactly
; AutoKickStart + AutoKickTime -- flagged bad on the first tick after grace and
; never given a window to recover. That player's link normally reads
; 805-3314 ms while other peers sit at 47-230 ms, so a 1000 ms bar runs through
; the middle of their normal range. At these values a host measured the same
; peer at 3418 and 4011 ms across full matches and never ejected them.
;
; Known cost, stated plainly: AutoKickLoss=200 is very likely unreachable, so a
; peer that goes truly DEAD will not be kicked and the match runs on until
; someone aborts. That is deliberate -- false kicks were hurting real players
; every session, the zombie match has been seen once. Set AutoKickLoss=50 to
; re-arm the reflex. AutoKickRelax=0 restores stock auto-kicking entirely.
;
; As with NetTune above, if this key is absent its default comes from
; openshim.ini [Network] GovernorTuning. This only matters when you host.
AutoKickRelax=1
AutoKickStart=60000
AutoKickPing=2000
AutoKickLoss=200
AutoKickTime=60000

; ---------------------------------------------------------------------------
; Send-rate governor cold start
; ---------------------------------------------------------------------------
; The game opens every match at a hardcoded 4000 B/s. GovernorStart pokes that
; sentinel to the given opening rate; 0 disables. Max 200000.
;
; A read of 4000 is classified by how it was arrived at. A match start writes
; 4000 over a value that has been sitting still; the governor collapsing onto
; its floor mid-match arrives from just above 4000 off a value that lasted one
; step. Both get the poke -- the alternative is a match that spends its life at
; 4 kB/s -- but they are logged and counted apart, as "cold-start" and
; "floor-rescue", so a sample set stays scoreable.
GovernorStart=0
; Diagnostic .text scan for the 4000 immediate. Development aid only.
GovernorScan=0

; ---------------------------------------------------------------------------
; Packet reordering  (EXPERIMENTAL - keep disabled unless testing)
; ---------------------------------------------------------------------------
EnablePacketReorder=0
PacketReorderWindowMs=100
PacketReorderMinWindowMs=5
EnableAdaptivePacketReorder=1
EnablePacketReorderWake=1
PacketReorderDepth=8
PacketReorderPeers=32
PacketReorderDrainCap=96

; ---------------------------------------------------------------------------
; Send duplication  (DEPRECATED/EXPERIMENTAL - duplicates worsen congestion)
; ---------------------------------------------------------------------------
SendDup=0
DupDelayMs=25
DupMaxPps=40

; ---------------------------------------------------------------------------
; Diagnostic capture
; ---------------------------------------------------------------------------
; Raw datagram ring. May contain payload fragments and peer endpoints.
EnableBufferLog=0
BufferLogPayloadBytes=32
BufferLogRingRecords=65536
; Optional filters. 0 / blank = capture every socket / every peer.
BufferLogSocketId=0
BufferLogPeer=

; BZRNet relay and control-plane capture. The openshim.ini [Diagnostics]
; RelayLogging key is the preferred way to turn this on; it drives these same
; switches plus the structured BZRNet trace.
EnableRelayCapture=0
; Log EVERY control-plane message rather than only the eight route-deciding
; ones. Needed to grow a replacement matchmaking service; carries account
; identity and lobby metadata, so review captures before sharing.
RelayLogAllControl=0
; Log every datagram on the endpoint-probe (1338) and UDP relay (1339) ports,
; unsampled. Per-packet volume.
RelayLogDatagrams=0

; Structured BZRNet trace (JSONL). Also driven by openshim.ini RelayLogging.
EnableBZRNetTrace=0
BZRNetTracePrivate=0
BZRNetTraceAllUdp=0
BZRNetTraceQueueRecords=4096

; ---------------------------------------------------------------------------
; Matchmaking redirect
; ---------------------------------------------------------------------------
; Point the BZRNet control plane at a hostname or IP of your own instead of
; Rebellion's. Hostname or IP only -- a value containing '/' is rejected.
; Used with reverse_engineering/bzrnet_server for dedicated-server work.
MatchmakingRedirectAddress=

; ---------------------------------------------------------------------------
; Legacy environment aliases
; ---------------------------------------------------------------------------
; Every key above is also readable from the process environment, which is
; useful for A/B runs from a launch script without editing this file. An
; environment value overrides the INI value. Both the BZ_ and OPENSHIM_ prefix
; are accepted for each name.
;
;   Dscp                        BZ_DSCP / OPENSHIM_DSCP
;   GovernorStart               BZ_GOV_START / OPENSHIM_GOV_START
;   GovernorScan                BZ_GOV_SCAN / OPENSHIM_GOV_SCAN
;   AutoKickRelax               BZ_AUTOKICK_RELAX / OPENSHIM_AUTOKICK_RELAX
;   AutoKickStart               BZ_AUTOKICK_START / OPENSHIM_AUTOKICK_START
;   AutoKickPing                BZ_AUTOKICK_PING / OPENSHIM_AUTOKICK_PING
;   AutoKickLoss                BZ_AUTOKICK_LOSS / OPENSHIM_AUTOKICK_LOSS
;   AutoKickTime                BZ_AUTOKICK_TIME / OPENSHIM_AUTOKICK_TIME
;   EnablePacketReorder         BZ_REORDER / OPENSHIM_REORDER
;   PacketReorderWindowMs       BZ_REORDER_WINDOW_MS / OPENSHIM_REORDER_WINDOW_MS
;   PacketReorderMinWindowMs    BZ_REORDER_MIN_MS / OPENSHIM_REORDER_MIN_MS
;   EnableAdaptivePacketReorder BZ_REORDER_ADAPT / OPENSHIM_REORDER_ADAPT
;   EnablePacketReorderWake     BZ_REORDER_WAKE / OPENSHIM_REORDER_WAKE
;   PacketReorderDepth          BZ_REORDER_DEPTH / OPENSHIM_REORDER_DEPTH
;   PacketReorderPeers          BZ_REORDER_PEERS / OPENSHIM_REORDER_PEERS
;   PacketReorderDrainCap       BZ_REORDER_DRAIN / OPENSHIM_REORDER_DRAIN
;   SendDup                     BZ_SEND_DUP / OPENSHIM_SEND_DUP
;   DupDelayMs                  BZ_DUP_DELAY_MS / OPENSHIM_DUP_DELAY_MS
;   DupMaxPps                   BZ_DUP_MAX_PPS / OPENSHIM_DUP_MAX_PPS
;   EnableBufferLog             BZ_BUFFER_LOG / OPENSHIM_BUFFER_LOG
;   BufferLogPayloadBytes       BZ_BUFFER_LOG_BYTES / OPENSHIM_BUFFER_LOG_BYTES
;   BufferLogRingRecords        BZ_BUFFER_LOG_RING / OPENSHIM_BUFFER_LOG_RING
;   BufferLogSocketId           BZ_BUFFER_LOG_SOCKET / OPENSHIM_BUFFER_LOG_SOCKET
;   BufferLogPeer               BZ_BUFFER_LOG_PEER / OPENSHIM_BUFFER_LOG_PEER
;   EnableRelayCapture          BZ_RELAY_CAPTURE / OPENSHIM_RELAY_CAPTURE
;   RelayLogAllControl          OPENSHIM_RELAY_LOG_ALL_CONTROL
;   RelayLogDatagrams           OPENSHIM_RELAY_LOG_DATAGRAMS
;   EnableBZRNetTrace           BZ_BZRNET_TRACE / OPENSHIM_BZRNET_TRACE
;   BZRNetTracePrivate          BZ_BZRNET_TRACE_PRIVATE / OPENSHIM_BZRNET_TRACE_PRIVATE
;   BZRNetTraceAllUdp           BZ_BZRNET_TRACE_ALL_UDP / OPENSHIM_BZRNET_TRACE_ALL_UDP
;   BZRNetTraceQueueRecords     BZ_BZRNET_TRACE_QUEUE / OPENSHIM_BZRNET_TRACE_QUEUE
;   MatchmakingRedirectAddress  BZ_MATCHMAKING_ADDRESS / OPENSHIM_MATCHMAKING_ADDRESS
;
; The Net* keys have no environment alias: they are new in this release and
; the INI is their only surface.
