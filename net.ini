; Test multiplayer profile for OpenShim packet-stability diagnostics.
; Copy this file next to battlezone98redux.exe or BZR.exe as net.ini.
; The goal is a higher update rate than the common 4000-bandwidth workshop
; profile while making auto-disconnect behavior much less aggressive during
; loss and transport investigations.
;
; IMPORTANT: packet reordering is disabled by default. The current reorder
; implementation is experimental: its wire sequence interpretation is not yet
; sufficiently validated, and overlapped WSARecvFrom traffic bypasses it.
; Enable it only for controlled testing with logs and captures.
;
; Packet duplication is deprecated/experimental and remains disabled. It can
; increase burst pressure and may make constrained uplinks worse.
;
; Buffer/relay captures can contain packet payload fragments, public endpoints,
; lobby metadata, and other sensitive network information. Keep captures local,
; review them before sharing, and obtain consent from other participants.

[Net]
MaxPing=450
UpCount=100
DownCount=50
MinBandwidth=16000
MaxBandwidth=320000
MaxPingsLost=60
AutoKickStart=60000
AutoKickPing=750
AutoKickLoss=75
AutoKickTime=45000
UseCompression=1

[OpenShimSocket]
Dscp=46
; EXPERIMENTAL. Keep disabled unless collecting controlled diagnostic evidence.
EnablePacketReorder=0
PacketReorderWindowMs=100
PacketReorderMinWindowMs=5
EnableAdaptivePacketReorder=1
EnablePacketReorderWake=1
PacketReorderDepth=8
PacketReorderPeers=32
PacketReorderDrainCap=96
LogPacketReorder=1
; DEPRECATED/EXPERIMENTAL. Duplicate sends can worsen burst congestion.
SendDup=0
DupDelayMs=25
DupMaxPps=40
GovernorStart=0
GovernorScan=0
AutoKickRelax=1
AutoKickStart=60000
AutoKickPing=2000
AutoKickLoss=200
AutoKickTime=60000
; Raw diagnostic capture. Disabled by default; may contain sensitive metadata.
EnableBufferLog=0
; Deep matchmaking/WebSocket capture. Disabled by default; review before sharing.
EnableRelayCapture=0
BufferLogPayloadBytes=32
BufferLogRingRecords=65536
BufferLogSocketId=0
BufferLogPeer=
