; Test multiplayer profile for OpenShim packet-stability diagnostics.
; Copy this file next to battlezone98redux.exe or BZR.exe as net.ini.
; The goal is a higher update rate than the common 4000-bandwidth workshop
; profile while making auto-disconnect behavior much less aggressive during
; loss and packet-path investigations.
;
; IMPORTANT: Packet reordering and packet duplication are experimental and
; disabled by default. The current reorder implementation depends on an
; unresolved interpretation of the game's wire sequence field and does not
; process the common overlapped WSARecvFrom path. Enable it only for controlled
; diagnostic sessions where added latency or packet-path regressions are
; acceptable.

[Net]
MaxPing=450
UpCount=100
DownCount=50
MinBandwidth=16000
MaxBandwidth=320000
MaxPingsLost=60
AutoKickStart=60000
AutoKickPing=750
AutoKickLoss=75
AutoKickTime=45000
UseCompression=1

[OpenShimSocket]
Dscp=46

; EXPERIMENTAL: disabled unless explicitly opted in for controlled testing.
EnablePacketReorder=0
PacketReorderWindowMs=100
PacketReorderMinWindowMs=5
EnableAdaptivePacketReorder=1
EnablePacketReorderWake=1
PacketReorderDepth=8
PacketReorderPeers=32
PacketReorderDrainCap=96
LogPacketReorder=1

; DEPRECATED EXPERIMENT: live testing indicates duplication may worsen
; constrained uplinks. Keep disabled outside deliberate comparison sessions.
SendDup=0
DupDelayMs=25
DupMaxPps=40

GovernorStart=0
GovernorScan=0
AutoKickRelax=1
AutoKickStart=60000
AutoKickPing=2000
AutoKickLoss=200
AutoKickTime=60000

; Local diagnostic capture is opt-in. These files may contain network metadata;
; review them before sharing and obtain consent before collecting other players'
; diagnostic data.
EnableBufferLog=0
EnableRelayCapture=0
BufferLogPayloadBytes=32
BufferLogRingRecords=65536
BufferLogSocketId=0
BufferLogPeer=
