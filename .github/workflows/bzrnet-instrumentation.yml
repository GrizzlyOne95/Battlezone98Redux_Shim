name: BZRNet instrumentation validation

on:
  pull_request:
    paths:
      - 'include/bzrnet_*'
      - 'src/patches/bzrnet_*'
      - 'tests/bzrnet_*'
      - 'include/socket_tunnel*'
      - 'src/patches/socket_tunnel*'
      - 'src/patches/net_optimizer.cpp'
      - 'tests/socket_tunnel*'
      - 'tools/socket_tunnel/**'
      - 'net.ini'
      - 'tests/CMakeLists.txt'
      - 'reverse_engineering/*bzrnet*'
      - 'reverse_engineering/BZRNET_NATIVE_INSTRUMENTATION.md'
      - 'bzrnet_capture_windows.ps1'
      - 'BZROpenShim.vcxproj'
      - 'src/dllmain.cpp'
      - '.github/workflows/bzrnet-instrumentation.yml'

jobs:
  tunnel-tests:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Configure tunnel tests
        run: cmake -S tests -B build/tunnel-tests -A Win32
      - name: Build tunnel protocol and configuration tests
        run: cmake --build build/tunnel-tests --config Release --target socket_tunnel_protocol_tests socket_tunnel_config_tests
      - name: Run tunnel protocol and configuration tests
        run: ctest --test-dir build/tunnel-tests -C Release -R socket_tunnel --output-on-failure
      - name: Build standalone Win32 tunnel
        shell: pwsh
        run: ./tools/socket_tunnel/build.ps1 -Out "$env:RUNNER_TEMP/socket_tunnel"
      - name: Test socket transport and recovery without Steam or the game
        shell: pwsh
        run: python tests/socket_tunnel_integration.py "$env:RUNNER_TEMP/socket_tunnel/socket_tunnel.exe" --out "$env:RUNNER_TEMP/tunnel-evidence"

  protocol-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure standalone protocol tests
        run: cmake -S tests -B build/bzrnet-tests -A Win32
      - name: Build standalone protocol tests
        run: cmake --build build/bzrnet-tests --config Release
      - name: Run standalone protocol tests
        run: .\build\bzrnet-tests\Release\bzrnet_protocol_tests.exe
      - name: Run BZRNet Python tool tests
        run: python -m unittest discover -s reverse_engineering -p "test_bzrnet*.py"
      - name: Parse BZRNet PowerShell capture wrapper
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path '.\bzrnet_capture_windows.ps1'),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | Format-List | Out-String | Write-Error
            exit 1
          }

  shim-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned Ogre reference headers
        shell: pwsh
        run: ./setup-dev.ps1
      - uses: microsoft/setup-msbuild@v2
      - name: Build OpenShim Release Win32
        run: msbuild BZROpenShim.sln /m /p:Configuration=Release /p:Platform=Win32
