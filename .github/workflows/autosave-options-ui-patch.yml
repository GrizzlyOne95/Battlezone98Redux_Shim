name: Apply AutoSave options UI patch

on:
  push:
    branches:
      - agent/autosave-options-ui

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/autosave-options-ui
          fetch-depth: 0

      - name: Patch AutoSave options UI
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}: {old[:80]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'include/autosave.h',
              '''    // Requests an immediate save using the same safety gates as scheduled
    // autosaves. Primarily useful for diagnostics and future UI/bridge work.
    bool TriggerAutoSaveNow();
''',
              '''    // Re-reads [AutoSave] from openshim.ini and applies Enabled/Interval
    // changes immediately. Returns false if enabling cannot initialize safely.
    bool ReloadAutoSaveConfig();

    // Requests an immediate save using the same safety gates as scheduled
    // autosaves. Primarily useful for diagnostics and future UI/bridge work.
    bool TriggerAutoSaveNow();
''')

          replace_once(
              'include/bzr_options_ui.h',
              '        Headlights,         // InitializeHeadlightConfig re-reads the ini (no latch)\n        RestartRequired,    // no live path; takes effect next launch\n',
              '        Headlights,         // InitializeHeadlightConfig re-reads the ini (no latch)\n        AutoSave,           // ReloadAutoSaveConfig re-reads the ini and applies immediately\n        RestartRequired,    // no live path; takes effect next launch\n')

          replace_once(
              'src/patches/bzr_options_ui.cpp',
              '#include "bzr_options_ui.h"\n\n#include "bzr_hooks.h"\n',
              '#include "bzr_options_ui.h"\n\n#include "autosave.h"\n#include "bzr_hooks.h"\n')

          replace_once(
              'src/patches/bzr_options_ui.cpp',
              '        static const char* const kShimSettingsOnOffValues[] = { "1", "0" };\n        static const char* const kShimSettingsOnOffLabels[] = { "On", "Off" };\n',
              '        static const char* const kShimSettingsOnOffValues[] = { "1", "0" };\n        static const char* const kShimSettingsOnOffLabels[] = { "On", "Off" };\n        static const char* const kShimSettingsAutoSaveIntervalValues[] = { "60", "120", "180", "300", "600" };\n        static const char* const kShimSettingsAutoSaveIntervalLabels[] = { "1 min", "2 min", "3 min", "5 min", "10 min" };\n')

          replace_once(
              'src/patches/bzr_options_ui.cpp',
              '''            { "Custom Keybinds", "General", "CustomBindsUi",
              kShimSettingsBindsUiAltKeys, 1,
              kShimSettingsOnOffValues, kShimSettingsOnOffLabels, 2, 0,
              ShimSettingApplyGroup::RestartRequired,
              "Key-binding editor on the Input options page. Restart required." },
            { "Weapon Convergence", "SinglePlayer", "WeaponConvergence", nullptr, 0,
''',
              '''            { "Custom Keybinds", "General", "CustomBindsUi",
              kShimSettingsBindsUiAltKeys, 1,
              kShimSettingsOnOffValues, kShimSettingsOnOffLabels, 2, 0,
              ShimSettingApplyGroup::RestartRequired,
              "Key-binding editor on the Input options page. Restart required." },
            { "AutoSave", "AutoSave", "Enabled", nullptr, 0,
              kShimSettingsOnOffValues, kShimSettingsOnOffLabels, 2, 0,
              ShimSettingApplyGroup::AutoSave,
              "Rolling recovery save for single-player missions; manual saves remain your checkpoints." },
            { "AutoSave Interval", "AutoSave", "IntervalSeconds", nullptr, 0,
              kShimSettingsAutoSaveIntervalValues, kShimSettingsAutoSaveIntervalLabels, 5, 1,
              ShimSettingApplyGroup::AutoSave,
              "How often OpenShim refreshes the rolling AutoSave recovery slot." },
            { "Weapon Convergence", "SinglePlayer", "WeaponConvergence", nullptr, 0,
''')

          replace_once(
              'src/patches/bzr_options_ui.cpp',
              '''            ApplyShimSettingLive(setting.applyGroup);

            g_ShimSettingsUiStatusText = std::string(setting.label) + " = " +
                setting.valueLabels[nextIndex] +
                (setting.applyGroup == ShimSettingApplyGroup::RestartRequired
                     ? "  (takes effect after restart)"
                     : "  (applied)");
''',
              '''            bool liveApplyOk = true;
            if (setting.applyGroup == ShimSettingApplyGroup::AutoSave)
                liveApplyOk = ReloadAutoSaveConfig();
            else
                ApplyShimSettingLive(setting.applyGroup);

            g_ShimSettingsUiStatusText = std::string(setting.label) + " = " +
                setting.valueLabels[nextIndex];
            if (setting.applyGroup == ShimSettingApplyGroup::RestartRequired)
                g_ShimSettingsUiStatusText += "  (takes effect after restart)";
            else if (!liveApplyOk)
                g_ShimSettingsUiStatusText += "  (saved; runtime apply failed - see openshim.log)";
            else
                g_ShimSettingsUiStatusText += "  (applied)";
''')

          replace_once(
              'src/patches/autosave.cpp',
              '''    void ShutdownAutoSave()
    {
''',
              '''    bool ReloadAutoSaveConfig()
    {
        if (g_gameDirectory.empty())
            return InitializeAutoSave();

        const bool wasEnabled = g_config.enabled;
        const ULONGLONG previousIntervalMs = g_config.intervalMs;
        LoadConfig();

        if (!g_config.enabled)
        {
            ResetMissionState();
            LogShimA(LogLevel::Info, "autosave", "Disabled live from OpenShim settings");
            return true;
        }

        // A game launched with AutoSave disabled never resolved SaveGame or
        // installed the recurring hook, so enabling it must finish setup live.
        if (!g_nativeSaveGame)
        {
            g_nativeSaveGame = ResolveNativeSaveGame();
            if (!g_nativeSaveGame)
                return false;
        }
        if (!g_hookInstalled && !InstallMainThreadHook())
        {
            g_nativeSaveGame = nullptr;
            return false;
        }

        if (!wasEnabled)
        {
            // Re-enter through normal mission detection so the initial grace
            // period still applies when AutoSave is enabled mid-mission.
            ResetMissionState();
        }
        else if (g_missionActive && previousIntervalMs != g_config.intervalMs)
        {
            // A changed interval starts fresh from the moment it is selected.
            g_nextSaveTick = GetTickCount64() + g_config.intervalMs;
        }

        LogShimA(
            LogLevel::Info,
            "autosave",
            "Reloaded live config enabled=1 interval=%llu ms initialDelay=%llu ms",
            g_config.intervalMs,
            g_config.initialDelayMs);
        return true;
    }

    void ShutdownAutoSave()
    {
''')

          replace_once(
              'docs/autosave.md',
              '## Configuration\n\nAdd an optional section to `<BZR game directory>\\openshim.ini`:\n',
              '''## Configuration

The in-game **OpenShim Settings** page exposes the two player-facing controls:

- **AutoSave** - On/Off. Applies immediately.
- **AutoSave Interval** - 1, 2, 3, 5, or 10 minutes. Applies immediately and restarts the current interval from the time it is changed.

The 10-second initial grace period, retry timing, migration backup, and EXU/legacy coexistence controls remain advanced INI-only settings.

The same values are stored in `<BZR game directory>\\openshim.ini`:
''')

          replace_once(
              'docs/autosave.md',
              'Set `Enabled=0` to retain OpenShim\'s AutoSave load-button support while disabling engine-level automatic save creation.\n',
              'Set `Enabled=0` to retain OpenShim\'s AutoSave load-button support while disabling engine-level automatic save creation. The in-game AutoSave toggle writes this same key.\n')

          replace_once(
              'openshim.ini.example',
              '[SinglePlayer]\n; These gameplay-affecting improvements are hard-disabled in network games,\n',
              '''[AutoSave]
; Rolling single-player recovery save. These two common controls are also
; available on the in-game OpenShim Settings page and apply immediately.
Enabled = 1
; Seconds between rolling AutoSave writes. UI choices: 60/120/180/300/600.
IntervalSeconds = 120
; Advanced safety/compatibility controls (INI-only).
InitialDelaySeconds = 10
RetrySeconds = 15
BackupExisting = 1
RespectExternalAutoSave = 1

[SinglePlayer]
; These gameplay-affecting improvements are hard-disabled in network games,
''')
          PY

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add include/autosave.h include/bzr_options_ui.h src/patches/autosave.cpp src/patches/bzr_options_ui.cpp openshim.ini.example
          git add -f docs/autosave.md
          git commit -m "Add AutoSave controls to OpenShim options"
          git push origin HEAD:agent/autosave-options-ui
