name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Build Shim
      run: msbuild BZROpenShim.sln /p:Configuration=Release /p:Platform=Win32 /m

    - name: Prepare Release Artifacts
      run: |
        mkdir release_assets
        cp bin/Release/winmm.dll release_assets/
        cp scripts/patches.json release_assets/
      shell: bash

    - name: Create Release
      id: create_release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          release_assets/winmm.dll
          release_assets/patches.json
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
