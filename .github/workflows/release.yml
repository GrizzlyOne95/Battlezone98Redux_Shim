name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    # softprops/action-gh-release creates the release through the REST API with
    # GITHUB_TOKEN. This repository's default workflow token is read-only, so
    # without this the build succeeds and Create Release fails with
    # "Resource not accessible by integration".
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    # The Ogre reference headers are an untracked sparse checkout, so a fresh
    # CI checkout has no OgreEntity.h and the build fails in the two Ogre
    # translation units. build-win32.yml has always done this; release.yml did
    # not, which is why every tagged release build since those files landed has
    # failed at the Build Shim step. Idempotent and pinned to one commit.
    - name: Fetch pinned Ogre reference headers
      shell: pwsh
      run: ./setup-dev.ps1

    - name: Build Shim
      run: msbuild BZROpenShim.sln /p:Configuration=Release /p:Platform=Win32 /m

    - name: Prepare Release Artifacts
      run: |
        mkdir release_assets
        cp bin/Release/winmm.dll release_assets/
        cp scripts/patches.json release_assets/
        # Ship the player-oriented preset and keep the exhaustive reference
        # alongside it so users can tweak settings without starting from the
        # developer configuration.
        cp openshim.ini release_assets/
        cp openshim.ini.example release_assets/
      shell: bash

    - name: Create Release
      id: create_release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          release_assets/winmm.dll
          release_assets/patches.json
          release_assets/openshim.ini
          release_assets/openshim.ini.example
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
