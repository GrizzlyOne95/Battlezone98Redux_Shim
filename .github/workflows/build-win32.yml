name: Build Win32

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: build-win32-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  release-win32:
    name: Apply nickname patches and build Release Win32
    runs-on: windows-2022
    timeout-minutes: 25

    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          ref: agent/bzrnet-live-nickname
          fetch-depth: 0

      - name: Apply staged source patches
        shell: pwsh
        run: |
          $patchDir = Join-Path $PWD '.github/agent/bzrnet-live-nickname'
          $patches = Get-ChildItem -LiteralPath $patchDir -Filter '*.patch' -File | Sort-Object Name
          if ($patches.Count -ne 7) {
            throw "Expected 7 staged patches, found $($patches.Count)"
          }
          foreach ($patch in $patches) {
            Write-Host "Checking $($patch.Name)"
            git apply --check --whitespace=nowarn -- $patch.FullName
            if ($LASTEXITCODE -ne 0) { throw "git apply --check failed for $($patch.Name)" }
            git apply --whitespace=nowarn -- $patch.FullName
            if ($LASTEXITCODE -ne 0) { throw "git apply failed for $($patch.Name)" }
          }

      - name: Validate nickname source invariants
        shell: pwsh
        run: |
          $source = Get-Content -LiteralPath 'src/patches/bzr_hooks.cpp' -Raw
          foreach ($forbidden in @('BzrNetStableId', 'SendBzrNetNicknameLive', 'kBzrNetLocalUserStableIdAddr', 'kBzrNetLobbyIdOffset')) {
            if ($source.Contains($forbidden)) { throw "Stale nickname implementation symbol remains: $forbidden" }
          }
          if ($source.Contains('"playerName"')) { throw 'Live nickname sender must not emit playerName' }
          foreach ($required in @('kBzrNetLobbyGetLocalIdentitySlot = 14', 'kBzrNetLobbySetPlayerDataSlot = 7', 'TryConstructNativeBzrString', 'OpenShimSetBZRNetNickname', '/nickname')) {
            if (-not $source.Contains($required)) { throw "Required nickname implementation marker missing: $required" }
          }
          $def = Get-Content -LiteralPath 'src/winmm.def' -Raw
          if (-not $def.Contains('OpenShimSetBZRNetNickname')) { throw 'winmm.def is missing OpenShimSetBZRNetNickname' }
          Write-Host 'Nickname source invariants passed.'

      - name: Validate network safety baseline
        shell: pwsh
        run: ./tools/validate-network-baseline.ps1

      - name: Fetch pinned Ogre reference headers
        shell: pwsh
        run: ./setup-dev.ps1

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build BZROpenShim
        shell: pwsh
        run: |
          msbuild BZROpenShim.sln `
            /m `
            /t:Build `
            /p:Configuration=Release `
            /p:Platform=Win32 `
            /p:GenerateFullPaths=true `
            /verbosity:minimal
          if ($LASTEXITCODE -ne 0) { throw 'BZROpenShim Release Win32 build failed' }
          $dll = Join-Path $PWD 'bin/Release/winmm.dll'
          if (-not (Test-Path -LiteralPath $dll -PathType Leaf)) {
            throw "Expected build output was not produced: $dll"
          }
          $hash = Get-FileHash -LiteralPath $dll -Algorithm SHA256
          Write-Host "winmm.dll SHA-256: $($hash.Hash.ToLowerInvariant())"

      - name: Commit qualified source changes
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- 'src/patches/bzr_hooks.cpp' 'include/bzr_hooks.h' 'src/winmm.def' 'reverse_engineering/bzrnet_live_nickname_20260818.md'
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { throw 'git diff --cached --check failed' }
          git commit -m 'feat: implement live BZRNet nickname updates'
          if ($LASTEXITCODE -ne 0) { throw 'Final source commit failed' }
          git push origin HEAD:agent/bzrnet-live-nickname
          if ($LASTEXITCODE -ne 0) { throw 'Push of qualified source changes failed' }
