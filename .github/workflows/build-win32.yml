name: Build Win32

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-win32-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  release-win32:
    name: Release Win32
    runs-on: windows-2022
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate network safety baseline
        shell: pwsh
        run: ./tools/validate-network-baseline.ps1

      - name: Fetch pinned Ogre reference headers
        shell: pwsh
        run: ./setup-dev.ps1

      - name: Run Ogre profiler algorithm tests
        shell: pwsh
        run: ./scripts/run_ogre_profiler_tests.ps1

      - name: Run INI/config tests
        shell: pwsh
        run: ./scripts/run_ini_tests.ps1

      - name: Validate DX11 Enhanced FXAA shader
        shell: pwsh
        run: |
          $kitsBin = Join-Path ${env:ProgramFiles(x86)} "Windows Kits\10\bin"
          $fxc = Get-ChildItem -LiteralPath $kitsBin -Filter fxc.exe -File -Recurse |
            Where-Object { $_.FullName -match '\\x86\\fxc\.exe$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1

          if (-not $fxc) {
            throw "Windows SDK fxc.exe was not found under $kitsBin"
          }

          $shader = Join-Path $PWD "shaders\dx11_enhanced_fxaa.hlsl"
          $includeDir = Join-Path $PWD "reverse_engineering\prerelease_2016\removed_files"
          $vsOut = Join-Path $env:RUNNER_TEMP "dx11_enhanced_fxaa_vs.cso"
          $psOut = Join-Path $env:RUNNER_TEMP "dx11_enhanced_fxaa_ps.cso"

          & $fxc.FullName /nologo /Ges /O3 /I $includeDir /T vs_5_0 /E VSMain /Fo $vsOut $shader
          if ($LASTEXITCODE -ne 0) {
            throw "DX11 Enhanced FXAA VSMain / vs_5_0 compilation failed"
          }

          & $fxc.FullName /nologo /Ges /O3 /I $includeDir /T ps_5_0 /E PSMain /Fo $psOut $shader
          if ($LASTEXITCODE -ne 0) {
            throw "DX11 Enhanced FXAA PSMain / ps_5_0 compilation failed"
          }

          "FXAA 3.11 HLSL5 validation passed using $($fxc.FullName)"

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build BZROpenShim
        shell: pwsh
        run: |
          msbuild BZROpenShim.sln `
            /m `
            /t:Build `
            /p:Configuration=Release `
            /p:Platform=Win32 `
            /p:GenerateFullPaths=true `
            /verbosity:minimal

      - name: Verify build outputs
        shell: pwsh
        run: |
          $dll = Join-Path $PWD "bin/Release/winmm.dll"
          $pdb = Join-Path $PWD "bin/Release/winmm.pdb"

          if (-not (Test-Path -LiteralPath $dll -PathType Leaf)) {
            throw "Expected build output was not produced: $dll"
          }

          $dllInfo = Get-Item -LiteralPath $dll
          $dllHash = Get-FileHash -LiteralPath $dll -Algorithm SHA256

          "winmm.dll size: $($dllInfo.Length) bytes" | Tee-Object -FilePath build-summary.txt
          "winmm.dll SHA-256: $($dllHash.Hash.ToLowerInvariant())" | Tee-Object -FilePath build-summary.txt -Append

          if (Test-Path -LiteralPath $pdb -PathType Leaf) {
            $pdbInfo = Get-Item -LiteralPath $pdb
            "winmm.pdb size: $($pdbInfo.Length) bytes" | Tee-Object -FilePath build-summary.txt -Append
          } else {
            "winmm.pdb was not produced" | Tee-Object -FilePath build-summary.txt -Append
          }

          Get-Content -LiteralPath build-summary.txt

      - name: Upload Release Win32 artifact
        uses: actions/upload-artifact@v4
        with:
          name: BZROpenShim-Release-Win32
          if-no-files-found: error
          retention-days: 14
          path: |
            bin/Release/winmm.dll
            bin/Release/winmm.pdb
            build-summary.txt
