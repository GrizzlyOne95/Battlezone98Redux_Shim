name: Win32 Build

on:
  pull_request:
    paths:
      - 'include/**'
      - 'src/**'
      - 'BZROpenShim.vcxproj'
      - 'BZROpenShim.sln'
      - '.github/workflows/win32-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-release-win32:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build Release Win32
        shell: powershell
        run: msbuild .\BZROpenShim.sln /m /p:Configuration=Release /p:Platform=Win32
