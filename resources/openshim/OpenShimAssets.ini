; OpenShim asset pack manifest — lightweight sentinel for DLL-only safety.
; This file ships with the Campaign Reimagined / OpenShim asset pack and is
; NOT present in a stock Battlezone 98 Redux installation. OpenShim uses it
; (when present) to distinguish "asset pack installed" from "DLL only" and to
; verify version compatibility without probing Workshop subscription state.
;
; The DLL also validates individual resource groups via filesystem probes, so a
; partial or stale pack where this file is present but payloads are missing
; still degrades gracefully. Do not edit this file by hand.
;
; FormatVersion = INI schema version (increment when parser/schema changes)
; CompatibilityVersion = asset compatibility epoch (increment when newer DLL
;   should reject an older asset pack, e.g. shader layout change). Version= is
;   kept as alias for CompatibilityVersion for backward compatibility.
[OpenShimAssets]
FormatVersion=1
CompatibilityVersion=1
Version=1
ChunkMeshes=1
EnhancedResources=1
CustomUI=1
TerrainHd=0
