; OpenShim Database content (Docs/DATABASE_SCREEN.md).
;
; Built into openshim.dll. A mod overrides it by shipping its own oshdb.cfg
; (read through the game's file system, so the enabled mod's copy is found):
; each [kind id] section in the mod's file merges over the one here, a key it
; names replaces every value of that key, "remove = 1" drops a section, and
; new sections are appended.
;
; Source rule: base-game text only (unit .inf/.des files, briefings, VO
; transcripts), plus the BZ98 Redux manual, the 1998 Brady strategy guide and
; the official Red Odyssey manual, each labelled. Nothing inferred. Unit
; names and roles come live from <odf>.inf line 1 and stats from <odf>.odf;
; this file only adds what those files do not hold.
;
; Keys:
;   [tab <id>]       label
;   [unit <odf>]     tab, name (role), model, designation = text | citation
;                    (repeatable), icon (texture), lore (kept empty until
;                    stock lore is cited)
;   [campaign <id>]  tab, label, missions (mission stems; repeatable)
;
; Citation keys: "BZ98 Redux manual pN [printed pages]" is the PDF page;
; "Brady guide Lnnnn" is a line of the 1998 Official Strategy Guide OCR text;
; "Red Odyssey manual pN [printed pages]"; campaigns.csv rows are GoombaBZ's
; VO transcripts.
;
; Icons: stock Redux ships no per-unit icon texture. Where it ships a
; loading-screen picture of the unit, that picture is used.

[tab nsdf]
label = NSDF

[tab cca]
label = CCA

[tab blackdogs]
label = Black Dogs

[tab cra]
label = CRA

[tab fury]
label = Fury

[tab briefings]
label = Briefings

